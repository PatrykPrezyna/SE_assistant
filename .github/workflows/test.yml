name: Tests

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install package
      run: |
        pip install -e .
    
    - name: Run test suite
      run: |
        python tests/test_system_explorer.py -v
      timeout-minutes: 10
    
    - name: Validate example models (if present)
      run: |
        # Check if methodology/example exists
        if [ -d "methodology/example" ]; then
          echo "Validating methodology/example..."
          system-explorer methodology/example --check || echo "Warning: validation failed"
        fi
      continue-on-error: true
