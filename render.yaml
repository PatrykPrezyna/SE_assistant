# Render blueprint for the hosted System Explorer (see "Hosted mode" in
# FEATURES.md). Secrets marked `sync: false` are entered in the Render
# dashboard, never committed.
services:
  - type: web
    name: system-explorer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    # the container clones the model repo itself, so only changes to the
    # explorer trigger a redeploy, never model edits
    buildFilter:
      paths:
        - src/**
        - Dockerfile
        - pyproject.toml
    envVars:
      # the model repo (not this one); GITHUB_TOKEN must have access to it
      - key: GITHUB_REPO
        value: PatrykPrezyna/cool-spine-model
      - key: GITHUB_BRANCH
        value: main
      - key: MODEL_PATH
        value: "."
      - key: PUBLIC_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_USERS
        sync: false
