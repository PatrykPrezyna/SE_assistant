  if (results.every(r => r.ok)) { setDirty(false); flash("saved ✓"); }
  else flash("save failed!");
}

// "Go back to the last saved version": drop every unsaved edit and re-read
// layout.json / views/*.json from disk by re-running the normal boot path.
// Save is already the single explicit commit point, so reloading the last
// commit is both cheaper and more predictable than an undo stack.
async function revert() {
  if (dirty && !confirm(
        "Discard unsaved changes and go back to the last saved version?"))
    return;
  layout = {};
  mode = "bdd";
  activityOwner = null;
  hiddenEdges = new Set();
  homeOpen = false;
  await init();
  setDirty(false);
  flash("reverted ✓");
}

function fillViewSel() {
  const sel = document.getElementById("viewSel");
  sel.innerHTML = "";
  for (const v of views) {
    const o = document.createElement("option");
    o.value = v.id;
    o.textContent = v.name;
    sel.appendChild(o);
  }
  sel.value = activeViewId || "";
}

async function switchToView(id) {
  await saveIfDirty();
  activeViewId = id;
  activeView = await (await fetch(`/api/views/${id}`)).json();
  applyDisplayOpts(activeView.options);
  applyViewKind(activeView);
  rebuild();
  restoreViewTransform();
  updateTitle();
  fillViewSel();
}

// ------------------------------------------------------------- view dropdown

// Populate the main view dropdown (top-left)
function fillViewDropdown() {
  const dropdown = document.getElementById("viewDropdown");
  if (!dropdown) return;
  dropdown.innerHTML = "";
  for (const v of views) {
    const opt = document.createElement("option");
    opt.value = v.id;
    opt.textContent = v.name;
    if (v.id === activeViewId) opt.selected = true;
    dropdown.appendChild(opt);
  }
}

document.getElementById("viewDropdown")?.addEventListener("change", evt => {
  switchToView(evt.target.value);
});

async function createView() {
  const name = prompt("New view name:", "");
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  const res = await fetch("/api/views", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: trimmed }),
  });
  const created = await res.json();
  views.push(created);
  views.sort((a, b) => a.name.localeCompare(b.name));
  await switchToView(created.id);
}

async function renameActiveView() {
  if (!activeView) return;
  const name = prompt("Rename view:", activeView.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed || trimmed === activeView.name) return;
  activeView.name = trimmed;
  const v = views.find(x => x.id === activeViewId);
  if (v) v.name = trimmed;
  fillViewSel();
  updateTitle();
  await save();
}

async function deleteActiveView() {
  if (!activeView) return;
  if (!confirm(`Delete view "${activeView.name}"? This cannot be undone.`)) return;
  const deletedId = activeViewId;
  await fetch(`/api/views/${deletedId}`, { method: "DELETE" });
  // don't try to resave the view we just deleted
  dirty = false;
  setDirty(false);
  views = views.filter(v => v.id !== deletedId);
  if (!views.length) {
    const res = await fetch("/api/views", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: "Default" }),
    });
    views = [await res.json()];
  }
  await switchToView(views[0].id);
}

// the toolbar shows the active View in the view switcher, so the only
// title left to keep in sync is the browser tab's
function updateTitle() {
  const name = activeView ? activeView.name : (model && model.package);
  document.title = name || "System Explorer";
  const h = document.getElementById("viewTitle");
  if (h) h.textContent = name || "Explorer";
}

// ------------------------------------------------------- detail sheet
// The same panel the published Viewer opens on a tap: the element's doc,
// its documentation link, and the requirements it satisfies or is
// satisfied by. Reading only — Edit is what changes the diagram.
function hideSheet() {
  document.body.classList.remove("sheet");
}

function sheetPeers(id, end, kinds) {
  const other = end === "from" ? "to" : "from";
  const out = [];
  for (const e of model.edges || []) {
    if (!kinds.includes(e.kind) || e[end] !== id) continue;
    if (e[other] && !out.includes(e[other])) out.push(e[other]);
  }
  return out;
}

function fillSheetLinks(listId, headId, ids) {
  const list = document.getElementById(listId);
  const head = document.getElementById(headId);
  list.textContent = "";
  head.classList.toggle("hidden", !ids.length);
  list.classList.toggle("hidden", !ids.length);
  const byId = Object.fromEntries(model.nodes.map(n => [n.id, n]));
  for (const id of ids) {
    const n = byId[id];
    if (!n) continue;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "row";
    btn.textContent = n.name;
    if (n.doc) {
      const small = document.createElement("small");
      small.textContent = n.doc;
      btn.appendChild(small);
    }
    btn.addEventListener("click", () => {
      showSheet(id);
      if (nodes[id]) { selectNode(id); centerOn(id); }
    });
    list.appendChild(btn);
  }
}

function showSheet(id) {
  if (!model) return;
  const n = model.nodes.find(x => x.id === id);
  if (!n) { hideSheet(); return; }
  document.body.classList.add("sheet");
  document.getElementById("sheetName").textContent = n.name;
  document.getElementById("sheetKind").textContent =
    "«" + n.kind + "»" + (n.shortName ? "  «" + n.shortName + "»" : "");
  const doc = document.getElementById("sheetDoc");
  doc.textContent = n.doc || "";
  doc.classList.toggle("hidden", !n.doc);
  const link = document.getElementById("docLink");
  const href = (layout.docs || {})[id];
  if (href) {
    link.href = /^https?:\/\//i.test(href)
      ? href : "/api/doc?path=" + encodeURIComponent(href);
    const leaf = String(href).split(/[\\/]/).pop();
    link.textContent = /^https?:\/\//i.test(href)
      ? "Open documentation" : "Open documentation (" + leaf + ")";
    link.classList.remove("hidden");
  } else {
    link.removeAttribute("href");
    link.classList.add("hidden");
  }
  fillSheetLinks("reqList", "reqHead", sheetPeers(id, "from", ["satisfy", "verify"]));
  fillSheetLinks("byList", "byHead", sheetPeers(id, "to", ["satisfy"]));
  fillSheetLinks("verList", "verHead", sheetPeers(id, "to", ["verify"]));
}
// ------------------------------------------------------- detail sheet end

// validation warnings from the parser (unbalanced braces, unrecognized
// statements, ambiguous names, unresolved references): a ⚠ counter in the
// toolbar, expandable into a banner listing every message — so a curated
// View can't silently look more complete than the model is
function showWarnings(list) {
  const btn = document.getElementById("warnBtn");
  const box = document.getElementById("warnings");
  box.textContent = "";
  for (const w of list) {
    const d = document.createElement("div");
    d.textContent = "⚠ " + w;
    box.appendChild(d);
  }
  if (list.length) {
    btn.textContent = "⚠ " + list.length;
    btn.style.display = "";
  } else {
    btn.style.display = "none";
    box.style.display = "none";
  }
}
document.getElementById("warnBtn").addEventListener("click", () => {
  const box = document.getElementById("warnings");
  box.style.display = box.style.display === "block" ? "none" : "block";
});

async function loadModel() {
  const m = await (await fetch("/api/model")).json();
  const errEl = document.getElementById("error");
  if (m.error) {
    errEl.textContent = "Parse error: " + m.error;
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";
  showWarnings(m.warnings || []);
  model = m;
  // an activity whose owner vanished from the reloaded model falls back
  if (mode === "activity") applyViewKind(activeView);
  updateTitle();
  rebuild();
}

// The assistant writes a new definition into a .sysml file. loadModel()
// reparses, but a View only draws ids listed in activeView.elements, so a
// new part def would stay hidden until someone checked it in the tree.
// Put the new definitions on the diagram. A person added to the context
// file is shown on the context view, next to the people already there.
async function refreshAfterAssistantEdit() {
  const before = new Set((model && model.nodes || []).map(n => n.id));
  await loadModel();
  if (!model) return;
  const added = model.nodes.filter(n => !before.has(n.id) && !n.usageOwner);
  if (!added.length) return;
  const inContext = added.some(n => /Context::/i.test(n.id));
  const contextView = (views || []).find(v => v.id === "context");
  if (inContext && contextView && activeViewId !== "context"
      && (contextView.kind || "bdd") !== "activity") {
    await switchToView("context");
  }
  if (mode !== "bdd" || !activeView) return;
  addToView(added.map(n => n.id));
  for (const n of added) placeNewNode(n.id);
  updateAllEdges();
  fitView();
  const last = added[added.length - 1];
  if (nodes[last.id]) selectNode(last.id);
  try { await save(); } catch (err) { /* the element is already on screen */ }
}

function placeNewNode(id) {
  const n = nodes[id];
  if (!n) return;
  let minX = Infinity, minY = Infinity, maxY = -Infinity, any = false;
  for (const other in nodes) {
    if (other === id) continue;
    any = true;
    minX = Math.min(minX, nodes[other].x);
    minY = Math.min(minY, nodes[other].y);
    maxY = Math.max(maxY, nodes[other].y + nodes[other].h);
  }
  n.x = any ? minX - n.w - 56 : 80;
  n.y = any ? (minY + maxY) / 2 - n.h / 2 : 40;
  n.el.setAttribute("transform", `translate(${n.x},${n.y})`);
}

// ensures `views` is non-empty and activeView/activeViewId point at a real
// view; a brand-new folder (no views yet) gets one auto-created and seeded
// with every current element, so the first launch isn't a blank canvas
async function bootstrapViews() {
  views = await (await fetch("/api/views")).json();
  if (!views.length) {
    const res = await fetch("/api/views", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: "Default" }),
    });
    const created = await res.json();
    const seeded = {
      version: VIEW_VERSION, name: created.name,
      // defs only — usage nodes are opt-in, and seeding both levels would
      // put every part on the canvas twice
      elements: model.nodes.filter(n => !n.usageOwner).map(n => n.id),
      nodes: {}, hiddenEdges: [], view: null, options: {},
    };
    await fetch(`/api/views/${created.id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(seeded),
    });
    views = [created];
  }
  for (const a of model.activities || []) {
    if (!views.some(v => v.activityOwner === a.owner))
      await ensureActivityView(a.owner);
  }
  views.sort((a, b) => a.name.localeCompare(b.name));

  const firstBdd = views.find(v => (v.kind || "bdd") !== "activity") || views[0];
  const wantId = layout.activeView && views.some(v => v.id === layout.activeView)
    ? layout.activeView : firstBdd.id;
  activeViewId = wantId;
  activeView = await (await fetch(`/api/views/${wantId}`)).json();
  applyDisplayOpts(activeView.options);
  applyViewKind(activeView);
}

async function init() {
  try {
    const saved = await (await fetch("/api/layout")).json();
    if (saved && typeof saved === "object") layout = saved;
  } catch (e) { /* no layout yet */ }
  if (!layout.docs) layout.docs = {};  // nodeId -> documentation path/URL
  if (!layout.version) layout.version = LAYOUT_VERSION;
  setExpertMode("expertMode" in layout ? layout.expertMode : false);
  setTreeOpen("treeOpen" in layout ? layout.treeOpen : true);

  const m = await (await fetch("/api/model")).json();
  const errEl = document.getElementById("error");
  if (m.error) {
    errEl.textContent = "Parse error: " + m.error;
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";
  showWarnings(m.warnings || []);
  model = m;

  await bootstrapViews();

  fillViewSel();
  fillViewDropdown();
  updateTitle();
  rebuild();
  restoreViewTransform();
}

document.getElementById("expertBtn").addEventListener("click", () => {
  setExpertMode(!expertMode);
  rebuild();
  setDirty(true);
});
document.getElementById("treeBtn").addEventListener("click", () => {
  setTreeOpen(!treeOpen);
  setDirty(true);
});
document.getElementById("saveBtn").addEventListener("click", save);
document.getElementById("revertBtn").addEventListener("click", revert);
document.getElementById("fitBtn").addEventListener("click", fitView);
document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.25));
document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.25));
document.getElementById("closeSheet").addEventListener("click", hideSheet);
document.getElementById("reloadBtn").addEventListener("click", () => {
  closeMenus();
  loadModel();
});
document.getElementById("viewSel").addEventListener("change", evt => {
  switchToView(evt.target.value);
});
document.getElementById("newViewBtn").addEventListener("click", createView);
document.getElementById("renameViewBtn").addEventListener("click", () => {
  closeMenus();
  renameActiveView();
});
document.getElementById("deleteViewBtn").addEventListener("click", () => {
  closeMenus();
  deleteActiveView();
});
unhideBtn.addEventListener("click", () => {
  closeMenus();
  hiddenEdges.clear();
  rebuild();
  setDirty(true);
});

function closeMenus() {
  document.getElementById("displayMenu").classList.remove("open");
  document.getElementById("moreMenu").classList.remove("open");
}
function toggleMenu(id, evt) {
  evt.stopPropagation();
  const panel = document.getElementById(id);
  const wasOpen = panel.classList.contains("open");
  closeMenus();
  if (!wasOpen) panel.classList.add("open");
}
document.getElementById("displayBtn").addEventListener("click", evt => {
  toggleMenu("displayMenu", evt);
});
document.getElementById("moreBtn").addEventListener("click", evt => {
  toggleMenu("moreMenu", evt);
});
document.addEventListener("mousedown", evt => {
  if (!evt.target.closest(".menu-wrap")) closeMenus();
});

for (const id of ["attrsCb", "partsCb", "keywordsCb", "edgeLabelsCb",
                  "packagesCb", "docsOnNodeCb"]) {
  document.getElementById(id).addEventListener("change", () => {
    rebuild();
    setDirty(true);
  });
}

document.getElementById("treeSearch").addEventListener("input", evt => {
  treeQuery = evt.target.value;
  renderTree();
});
document.getElementById("treeKinds").addEventListener("click", evt => {
  const btn = evt.target.closest("button[data-kind]");
  if (!btn) return;
  treeKind = btn.dataset.kind;
  for (const b of document.querySelectorAll("#treeKinds button"))
    b.classList.toggle("active", b === btn);
  renderTree();
});

window.addEventListener("keydown", evt => {
  if ((evt.ctrlKey || evt.metaKey) && evt.key === "s") {
    evt.preventDefault();
    save();
  }
});
window.addEventListener("beforeunload", evt => {
  if (dirty) evt.preventDefault();
});

init();
</script>
<script src="/assistant_panel.js"></script>
</body>
</html>
