<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Explorer</title>
<style>
  :root { --bar: 49px; color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: "Segoe UI", system-ui, sans-serif; background: #f3f5f8;
    color: #1c1c1c; }
  #toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: #fff; border-bottom: 1px solid #e2e5ea; font-size: 14px;
    flex-wrap: wrap; min-height: 48px; box-sizing: border-box;
    overflow: visible; }
  #toolbar h1 { font-size: 17px; font-weight: 650; margin: 0; line-height: 1.3;
    white-space: nowrap; }
  #toolbar .sep { width: 1px; height: 18px; background: #e2e5ea; margin: 0 2px;
    flex: none; }
  #toolbar button, #zoombar button { font: inherit; font-size: 14px;
    min-height: 36px; padding: 6px 12px; cursor: pointer; border-radius: 8px;
    border: 1px solid #d5d8de; background: #fff; }
  #toolbar label { user-select: none; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 6px; }
  #toolbar select { font: inherit; font-size: 14px; max-width: 180px;
    min-height: 36px; border-radius: 8px; border: 1px solid #d5d8de;
    background: #fff; padding: 4px 8px; }
  #toolbar .grow { flex: 1; min-width: 8px; }
  /* Reading is the default. Edit (expert mode) reveals the authoring
     controls — see setExpertMode(). */
  body:not(.expert) .expert-only,
  body:not(.expert) .edit-only { display: none !important; }
  #expertBtn.on { color: #1a6bbf; border-color: #b9d4ee; background: #eaf3fc; }
  #status { color: #2a7; min-width: 70px; }
  #status.dirty { color: #c60; }
  .menu-wrap { position: relative; }
  .menu-panel { display: none; position: absolute; top: 100%; left: 0;
    margin-top: 4px; background: #fff; border: 1px solid #ccc;
    border-radius: 4px; padding: 6px 0; min-width: 200px; z-index: 30;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .menu-panel.open { display: block; }
  .menu-panel .item { display: block; width: 100%; text-align: left;
    border: none; background: none; padding: 5px 14px; font-size: 13px;
    cursor: pointer; box-sizing: border-box; }
  .menu-panel .item:hover { background: #eef4fb; }
  .menu-panel label.item { display: flex; align-items: center; gap: 8px;
    cursor: pointer; }
  .menu-panel label.item input { margin: 0; }
  .menu-panel .sep { border-top: 1px solid #e5e5e5; margin: 4px 0;
    height: 0; width: auto; background: none; }
  #error { position: fixed; top: var(--bar); left: 0; right: 0; z-index: 10;
    background: #fdd; color: #900; padding: 6px 12px; display: none; }
  #warnBtn { color: #a05a00; }
  #warnings { position: fixed; top: var(--bar); left: 0; right: 0; z-index: 9;
    background: #fff8e1; color: #7a5c00; border-bottom: 1px solid #e0c060;
    padding: 4px 12px; display: none; max-height: 30%; overflow-y: auto;
    font-size: 12px; }
  #warnings div { padding: 1px 0; }
  #emptyHint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 5; max-width: 320px; text-align: center; color: #666;
    font-size: 14px; line-height: 1.45; pointer-events: none;
    padding: 16px 20px; background: rgba(255,255,255,.92);
    border: 1px solid #e0e0e0; border-radius: 6px; }
  #emptyHint.hidden { display: none; }
  /* View dropdown in top-left */
  #viewDropdown { font: inherit; font-size: 14px; min-width: 200px;
    min-height: 36px; border-radius: 8px; border: 1px solid #d5d8de;
    background: #fff; padding: 4px 8px; }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab;
    touch-action: none; user-select: none; -webkit-user-select: none;
    background:
      linear-gradient(#e6e9ee 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #e6e9ee 1px, transparent 1px) 0 0 / 24px 24px,
      #f7f8fb; }
  #zoombar { position: fixed; top: calc(var(--bar) + 12px); right: 12px;
    z-index: 18; display: flex; flex-direction: column; gap: 8px; }
  body.home-open #zoombar { display: none; }
  #zoombar button { width: 44px; height: 44px; min-height: 44px; padding: 0;
    font-size: 22px; line-height: 1; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #zoomFit, #fitBtn { font-size: 13px; font-weight: 650; }
  #canvas.panning { cursor: grabbing; }
  .node rect.body { fill: #fff; stroke: #1a6bbf; stroke-width: 1.5; }
  .node.req rect.body { fill: #fff8e1; stroke: #a08000; }
  .node.usage rect.body { fill: #fff; }
  .node.actor rect.body { fill: #f3f0ff; stroke: #5b4b8a; }
  .node.usecase rect.body { fill: #f3fff6; stroke: #2e7d4f; }
  .node line.sep { stroke: #d5d8de; stroke-width: 1; }
  .node text { fill: #222; font-size: 12px; }
  .node text.stereo { fill: #666; font-size: 11px; }
  .node text.name { font-size: 13px; font-weight: 600; }
  .node text.pkg { fill: #999; font-size: 10px; }
  .node text.doc { fill: #555; font-style: italic; }
  .node.dragging rect.body { stroke: #1a6fd4; stroke-width: 2; }
  .node.sel rect.body { stroke: #d4351a; stroke-width: 2.5; }
  .node.hl rect.body { stroke: #1a6fd4; stroke-width: 1.8; }
  .node { cursor: pointer; }
  body.expert .node { cursor: move; }
  .node text.docicon { font-size: 11px; }
  .node text.activityicon { font-size: 11px; }
  .node.action rect.body { fill: #fff7e6; }
  .node.control rect.body { fill: #eee; rx: 10; ry: 10; }
  .node.decision polygon.body { fill: #fff; stroke: #333; stroke-width: 1.2; }
  .lane rect { stroke: none; }
  .lane text { fill: #888; font-size: 11px; font-weight: 600;
    text-anchor: middle; dominant-baseline: hanging; }
  .edge.flow line.wire { stroke: #1a6fd4; stroke-width: 1.4; }
  .edge.flow text { fill: #1a6fd4; }
  .edge { cursor: pointer; }
  .edge line.hit { stroke: transparent; stroke-width: 14; pointer-events: stroke; }
  .edge line.wire, .edge path { stroke: #555; stroke-width: 1.2; fill: none; }
  .edge.typing line.wire { stroke-dasharray: 5 4; }
  .edge.satisfy line.wire { stroke-dasharray: 5 4; stroke: #a08000; }
  .edge.satisfy text { fill: #7a6a00; }
  .edge.verify line.wire { stroke-dasharray: 5 4; stroke: #1a6aa8; }
  .edge.verify text { fill: #1a6aa8; }
  .edge.connector line.wire { stroke: #2a8f4d; stroke-width: 1.4; }
  .edge.connector text { fill: #1f6b39; }
  .edge.association line.wire { stroke: #6a3fa0; }
  .edge.association text { fill: #6a3fa0; }
  .edge text { font-size: 11px; fill: #444; paint-order: stroke;
    stroke: #fff; stroke-width: 3px; }
  .edge.hl line.wire { stroke-width: 2.2; }
  .edge.sel line.wire { stroke: #d4351a; stroke-width: 2.6; }
  .edge.sel text { fill: #d4351a; }
  #legend { position: fixed; bottom: 10px; left: 12px; z-index: 10;
    background: rgba(255,255,255,.95); border: 1px solid #ddd;
    border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #333;
    display: none; }
  #legend .lrow { display: flex; align-items: center; gap: 8px;
    padding: 2px 0; }
  #legend svg { flex: none; }
  #ctxmenu { position: fixed; z-index: 20; background: #fff;
    border: 1px solid #ccc; border-radius: 4px; padding: 4px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); min-width: 190px;
    display: none; font-size: 13px; user-select: none; }
  #ctxmenu .item { padding: 5px 14px; cursor: pointer; white-space: nowrap; }
  #ctxmenu .item:hover { background: #eef4fb; }
  #ctxmenu .item.disabled { color: #aaa; cursor: default; }
  #ctxmenu .item.disabled:hover { background: none; }
  #ctxmenu .sep { border-top: 1px solid #e5e5e5; margin: 4px 0; }
  #tree { position: fixed; top: var(--bar); left: 0; bottom: 0; width: 260px;
    overflow-y: auto; overflow-x: hidden; background: #fafafa;
    border-right: 1px solid #ddd; font-size: 12px; padding: 0 0 6px; z-index: 8;
    display: flex; flex-direction: column; }
  #tree.hidden { display: none; }
  #tree.disabled { opacity: .55; pointer-events: none; }
  #treeFilters { flex: none; padding: 8px 8px 6px; border-bottom: 1px solid #e8e8e8;
    background: #fafafa; position: sticky; top: 0; z-index: 1; }
  #treeSearch { width: 100%; box-sizing: border-box; font-size: 12px;
    padding: 4px 6px; margin-bottom: 6px; }
  #treeKinds { display: flex; flex-wrap: wrap; gap: 4px; }
  #treeKinds button { font-size: 11px; padding: 2px 7px; cursor: pointer;
    border: 1px solid #ccc; background: #fff; border-radius: 3px; color: #555; }
  #treeKinds button.active { background: #e8f0fa; border-color: #7aa2d4;
    color: #1a4a7a; }
  #treeBody { flex: 1; overflow-y: auto; padding: 6px 0; }
  #tree .pkg { display: flex; align-items: center; gap: 5px; padding: 3px 8px;
    font-weight: 600; color: #555; cursor: pointer;
    user-select: none; white-space: nowrap; }
  #tree .pkg:hover { background: #eef0f2; }
  #tree .pkg input { flex: none; margin: 0; }
  #tree .pkg .tri { display: inline-block; width: 12px; }
  #tree .pkg-body { margin-left: 10px; }
  #tree .pkg-body.collapsed { display: none; }
  #tree .elem { display: flex; align-items: center; gap: 5px;
    padding: 2px 8px 2px 20px; white-space: nowrap; overflow: hidden; }
  #tree .elem:hover { background: #eef4fb; }
  #tree .elem input { flex: none; margin: 0; }
  #tree .elem .lbl { cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  #tree .elem.dimmed .lbl { color: #999; font-style: italic; }
  #tree .elem .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: #ccc; }
  #tree .elem.k-req .dot { background: #e8c93a; }
  #tree .elem.k-actor .dot { background: #a480e0; }
  #tree .elem.k-usecase .dot { background: #6fc98a; }
  #tree .elem.k-usage .dot { background: #7fb0e0; }
  #modalOverlay { position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.35); display: flex; align-items: center;
    justify-content: center; }
  #modalOverlay.hidden { display: none; }
  #modalBox { background: #fff; border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25); width: 440px; max-width: 90vw;
    max-height: 80vh; display: flex; flex-direction: column; font-size: 13px; }
  #modalHead { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid #eee; }
  #modalBody { padding: 12px 14px; overflow-y: auto; flex: 1; }
  #modalBody p { margin: 0 0 8px; color: #444; }
  #modalBody input[type=text] { width: 100%; box-sizing: border-box;
    padding: 5px 6px; font-size: 13px; }
  #modalFoot { padding: 10px 14px; border-top: 1px solid #eee;
    display: flex; justify-content: flex-end; gap: 8px; }
  #modalFoot button, #modalBody button { font-size: 13px; padding: 4px 10px;
    cursor: pointer; }
  #browsePath { color: #666; font-size: 12px; margin: 10px 0 4px;
    word-break: break-all; }
  #browseList { border: 1px solid #ddd; border-radius: 4px; max-height: 260px;
    overflow-y: auto; }
  #browseList .row { padding: 4px 8px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #browseList .row:hover { background: #eef4fb; }
  #browseList .row.empty { cursor: default; color: #999; }
  #browseList .row.empty:hover { background: none; }
  body.sheet #legend { display: none !important; }
  #sheet { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 16;
    max-height: 50%; max-height: 50dvh; box-sizing: border-box; overflow: auto;
    touch-action: pan-y; background: #fff; border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 28px rgba(0,0,0,.16); padding: 8px 16px 24px; }
  body.sheet #sheet { display: block; }
  #sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: #ddd;
    margin: 4px auto 10px; }
  #sheet h2 { font-size: 18px; margin: 0 8px 2px 0; }
  #sheet .kind { color: #777; font-size: 12px; margin: 0 0 10px; }
  #sheet .doc { white-space: pre-wrap; font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
  #sheet .doc:empty, #sheet .doc.hidden { display: none; }
  #docLink { display: inline-block; margin: 0 0 14px; color: #1a6bbf; font-size: 15px; }
  #docLink.hidden { display: none; }
  #sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: #888; margin: 8px 0; }
  #sheet h3.hidden, #sheet ul.hidden { display: none; }
  #sheet ul { list-style: none; margin: 0 0 8px; padding: 0; }
  #sheet button.row { display: block; width: 100%; text-align: left; font: inherit;
    padding: 10px 12px; margin: 0 0 8px; border-radius: 10px;
    border: 1px solid #e4e6eb; background: #fafbfc; min-height: 44px; cursor: pointer; }
  #sheet button.row small { display: block; color: #555; font-size: 13px;
    white-space: pre-wrap; margin-top: 2px; }
  #closeSheet { position: absolute; top: 10px; right: 12px; border: none;
    background: none; font-size: 22px; line-height: 1; padding: 8px; color: #666;
    cursor: pointer; }
</style>
<link rel="stylesheet" href="/assistant_panel.css">
</head>
<body>
<div id="toolbar">
  <label>view <select id="viewDropdown"></select></label>
  <h1 id="viewTitle">Explorer</h1>
  <button id="treeBtn" class="expert-only" title="Show/hide the element tree">Tree</button>
  <select id="viewSel" class="edit-only"></select>
  <button id="newViewBtn" class="expert-only" title="Create a new view">+</button>
  <span class="sep edit-only"></span>
  <button id="saveBtn" class="edit-only" title="Ctrl+S">Save</button>
  <button id="revertBtn" class="edit-only" disabled
          title="Discard unsaved changes and go back to the last saved version">Revert</button>
  <span class="sep edit-only"></span>
  <div class="menu-wrap">
    <button id="displayBtn" title="What to show on nodes and edges">Display ▾</button>
    <div id="displayMenu" class="menu-panel" role="menu">
      <label class="item"><input type="checkbox" id="attrsCb" checked> attributes</label>
      <label class="item"><input type="checkbox" id="partsCb" checked> parts</label>
      <label class="item"><input type="checkbox" id="keywordsCb"> «part def» keywords</label>
      <label class="item"><input type="checkbox" id="edgeLabelsCb"> edge labels</label>
      <label class="item"><input type="checkbox" id="packagesCb"> package paths</label>
      <label class="item"><input type="checkbox" id="docsOnNodeCb"> docs on node</label>
    </div>
  </div>
  <div class="menu-wrap">
    <button id="moreBtn" title="More actions">More ▾</button>
    <div id="moreMenu" class="menu-panel" role="menu">
      <button type="button" class="item" id="reloadBtn" title="Re-parse the .sysml files, keep positions">Reload model</button>
      <div class="sep expert-only"></div>
      <button type="button" class="item expert-only" id="renameViewBtn" title="Rename the current view">Rename view</button>
      <button type="button" class="item expert-only" id="deleteViewBtn" title="Delete the current view">Delete view</button>
      <div class="sep expert-only"></div>
      <button type="button" class="item expert-only" id="unhideBtn" title="Show connections hidden via right-click">Unhide connections</button>
    </div>
  </div>
  <span class="grow"></span>
  <button id="assistantToggle" title="Open the SE assistant chat">Chat</button>
  <button id="expertBtn" aria-pressed="false" title="Edit — move elements and change views">Edit</button>
  <button id="warnBtn" style="display:none" title="Model validation warnings — click to show/hide"></button>
  <span id="status"></span>
</div>
<div id="error"></div>
<div id="warnings"></div>
<div id="emptyHint" class="hidden">This view is empty. Check elements in the tree to add them.</div>
<div id="ctxmenu"></div>
<div id="modalOverlay" class="hidden">
  <div id="modalBox">
    <div id="modalHead"></div>
    <div id="modalBody"></div>
    <div id="modalFoot"></div>
  </div>
</div>
<div id="legend"></div>
<div id="tree">
  <div id="treeFilters">
    <input id="treeSearch" type="search" placeholder="Search elements…" autocomplete="off">
    <div id="treeKinds">
      <button type="button" data-kind="all" class="active">All</button>
      <button type="button" data-kind="req">Req</button>
      <button type="button" data-kind="part">Part</button>
      <button type="button" data-kind="actor">Actor</button>
      <button type="button" data-kind="usecase">Use case</button>
    </div>
  </div>
  <div id="treeBody"></div>
</div>
<div id="zoombar">
  <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
  <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
  <button type="button" id="fitBtn" aria-label="Show whole diagram">Fit</button>
</div>
<aside id="sheet" aria-live="polite">
  <div class="grab"></div>
  <button type="button" id="closeSheet" aria-label="Close">×</button>
  <h2 id="sheetName"></h2>
  <p class="kind" id="sheetKind"></p>
  <p class="doc" id="sheetDoc"></p>
  <a id="docLink" target="_blank" rel="noopener">Open documentation</a>
  <h3 id="reqHead">Requirements</h3>
  <ul id="reqList"></ul>
  <h3 id="byHead">Satisfied by</h3>
  <ul id="byList"></ul>
  <h3 id="verHead">Verified by</h3>
  <ul id="verList"></ul>
  <ul id="sheetEdges"></ul>
</aside>

<!-- SE Assistant Chat Panel -->
<div id="assistantPanel" aria-label="Assistant">
  <div id="assistantHeader">
    <div class="assistant-title">
      <h3>Assistant</h3>
      <p>Asks, then edits the model</p>
    </div>
    <button id="assistantClose" type="button" aria-label="Close chat">×</button>
  </div>
  <div id="assistantMessages" aria-live="polite"></div>
  <div id="assistantInput">
    <textarea id="assistantInputText" placeholder="Ask about the model" rows="2"></textarea>
    <button id="assistantSend" type="button">Send</button>
  </div>
</div>

<svg id="canvas">
  <defs>
    <marker id="mTriangle" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14"
            refX="0" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#fff" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="mDiamond" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10"
            refX="0" refY="5" orient="auto">
      <path d="M0,5 L8,0 L16,5 L8,10 Z" fill="#555"/>
    </marker>
    <marker id="mOpen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
      <path d="M0,1 L10,6 L0,11" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="mOpenSat" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
      <path d="M0,1 L10,6 L0,11" fill="none" stroke="#a08000" stroke-width="1.2"/>
    </marker>
    <marker id="mBall" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"
            refX="5" refY="5">
      <circle cx="5" cy="5" r="4" fill="#2a8f4d"/>
    </marker>
  </defs>
  <g id="world">
    <g id="laneLayer"></g>
    <g id="edgeLayer"></g>
    <g id="nodeLayer"></g>
  </g>
</svg>
<script>
"use strict";

// display parameters -------------------------------------------------
// Per-View display options (attrs, parts, keywords, edgeLabels, packages,
// docsOnNode) live in the View JSON and are controlled from the Display
// menu. The legend appears whenever edge kinds are present.
const LAYOUT_VERSION = 1;
const VIEW_VERSION = 1;
// layout.json keys written by older versions (IBD / use case diagram
// drilldowns, activity mode before activities became Views); dropped on save
const STALE_LAYOUT_KEYS = ["ibdOwner", "mode", "ucdOwner", "activityOwner",
  "drilldownNodes", "drilldownHiddenEdges", "drilldownView"];

const DISPLAY_DEFAULTS = {
  attrs: true,
  parts: true,
  keywords: false,
  edgeLabels: false,
  packages: false,
  docsOnNode: false,
};

function displayOpts() {
  return {
    attrs: document.getElementById("attrsCb").checked,
    parts: document.getElementById("partsCb").checked,
    keywords: document.getElementById("keywordsCb").checked,
    edgeLabels: document.getElementById("edgeLabelsCb").checked,
    packages: document.getElementById("packagesCb").checked,
    docsOnNode: document.getElementById("docsOnNodeCb").checked,
  };
}

function applyDisplayOpts(opts) {
  const o = Object.assign({}, DISPLAY_DEFAULTS, opts || {});
  document.getElementById("attrsCb").checked = !!o.attrs;
  document.getElementById("partsCb").checked = !!o.parts;
  document.getElementById("keywordsCb").checked = !!o.keywords;
  document.getElementById("edgeLabelsCb").checked = !!o.edgeLabels;
  document.getElementById("packagesCb").checked = !!o.packages;
  document.getElementById("docsOnNodeCb").checked = !!o.docsOnNode;
}

// The header height follows the bar itself (reading vs Edit can differ).
// --bar keeps the tree and the home page below it.
function chromeTop() {
  const bar = document.getElementById("toolbar");
  const h = bar ? bar.offsetHeight : 49;
  document.documentElement.style.setProperty("--bar", h + "px");
  return h;
}
// A wrapped header (a phone, or Edit turned on) must push the zoom buttons
// down with it, or they sit underneath the bar and cannot be tapped.
if (window.ResizeObserver) {
  const bar = document.getElementById("toolbar");
  if (bar) new ResizeObserver(() => chromeTop()).observe(bar);
}
const TREE_WIDTH = 260;

const svg = document.getElementById("canvas");
const world = document.getElementById("world");
const laneLayer = document.getElementById("laneLayer");
const edgeLayer = document.getElementById("edgeLayer");
const nodeLayer = document.getElementById("nodeLayer");
const statusEl = document.getElementById("status");
const unhideBtn = document.getElementById("unhideBtn");
const treeEl = document.getElementById("tree");

let model = null;                 // parsed model from the server
let layout = {};                  // global state: docs, treeOpen, activeView,
                                   // home, expertMode
let nodes = {};                   // id -> {data, x, y, w, h, el} (visible only)
let edges = [];                   // visible edges
let view = { tx: 0, ty: 0, s: 1 };
let dirty = false;

// Views (SysML v2's term for a curated presentation of model content): the
// user creates as many as they like, each with its own membership set,
// positions, hidden connections, filters, and pan/zoom — persisted as its
// own file (see /api/views). Activity diagrams are Views too (`kind:
// "activity"`).
let views = [];                   // [{id, name, kind, activityOwner}, ...] from /api/views
let activeViewId = null;
let activeView = null;            // {name, kind, activityOwner, elements, nodes, hiddenEdges, view, options}

let hiddenEdges = new Set();      // the active View's hidden connections (working
                                   // copy; always empty in activity Views)
let mode = "bdd";                 // "bdd" | "activity" (from the active View's kind)
let activityOwner = null;          // id of the part def whose activity diagram is shown
let selection = null;              // {type:"node", id} | {type:"edge", key}
let treeOpen = true;               // element tree panel shown/hidden (preference)
let expertMode = false;            // custom-diagram building unlocked (⚙ toggle)
let treeQuery = "";                // filter text for the element tree
let treeKind = "all";              // "all" | "req" | "part" | "actor" | "usecase"

function isActivityView(v) {
  return !!(v && v.kind === "activity" && v.activityOwner);
}
// the active View's position store. A function, not a variable, so
// mutations always land on the real object (activeView.nodes), never a
// stale copy left behind by a View switch.
function posMap() {
  if (activeView && !activeView.nodes) activeView.nodes = {};
  return activeView.nodes;
}

const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(text, font) {
  measureCtx.font = font;
  return measureCtx.measureText(text).width;
}

function setDirty(d) {
  dirty = d;
  statusEl.textContent = d ? "unsaved changes" : statusEl.textContent;
  statusEl.className = d ? "dirty" : "";
  // nothing to go back to while the canvas matches what's on disk
  const rb = document.getElementById("revertBtn");
  if (rb) rb.disabled = !d;
}

function flash(msg) {
  statusEl.className = "";
  statusEl.textContent = msg;
  setTimeout(() => { if (!dirty) statusEl.textContent = ""; }, 2000);
}

// ---------------------------------------------------------------- visibility

function edgeKey(d) {
  return d.kind + "|" + d.from + "|" + d.to + "|" + (d.label || "");
}

// every package path an element belongs to, plus all of its ancestor
// package paths (so an empty "wrapper" package with only subpackages is
// still a header worth showing even though no element sits directly in it)
// — used by the element tree, not by view membership
function packagePathsOf(nodeList) {
  const set = new Set();
  for (const n of nodeList) {
    const p = n.packagePath || "";
    if (!p) continue;
    let acc = "";
    for (const part of p.split("::")) {
      acc = acc ? acc + "::" + part : part;
      set.add(acc);
    }
  }
  return set;
}

// a View's visible elements are exactly its curated membership set,
// intersected with whatever still exists in the (possibly reloaded) model
function visibleIds() {
  const ids = new Set(model.nodes.map(n => n.id));
  return new Set((activeView.elements || []).filter(id => ids.has(id)));
}

// ---------------------------------------------------------------- nodes

function wrapText(text, maxChars) {
  const words = text.split(/\s+/), lines = [];
  let line = "";
  for (const w of words) {
    if (line && (line + " " + w).length > maxChars) { lines.push(line); line = w; }
    else line = line ? line + " " + w : w;
  }
  if (line) lines.push(line);
  return lines;
}

function buildNodeContent(d) {
  const opts = displayOpts();
  const header = [];
  if (opts.keywords)
    header.push({ text: "«" + d.kind + "»", cls: "stereo" });
  // Usage nodes show only the role name (not `role : Type`). The type is
  // already on the typing edge ("is a"); see NOTATION.md N3. `usageType`
  // stays on the model for edges / menus.
  header.push({ text: (d.shortName ? d.shortName + " " : "") + d.name,
                cls: "name", italic: d.abstract });
  if (opts.packages && d.package) header.push({ text: d.package, cls: "pkg" });
  const compartments = [];
  if (opts.attrs && d.attributes.length)
    compartments.push(d.attributes.map(t => ({ text: t, cls: "" })));
  if (opts.parts && d.parts.length) {
    const lines = [];
    for (const p of d.parts) {
      lines.push({ text: p.text, cls: "" });
      if (opts.attrs)
        for (const a of p.attrs) lines.push({ text: "    ." + a, cls: "" });
    }
    compartments.push(lines);
  }
  if (opts.docsOnNode && d.doc)
    compartments.push(wrapText(d.doc, 40).map(t => ({ text: t, cls: "doc" })));
  return { header, compartments };
}

const LINE_H = 16, PAD = 8;

function fontFor(item) {
  const family = '"Segoe UI", system-ui, sans-serif';
  if (item.cls === "name") return "600 13px " + family;
  if (item.cls === "stereo") return "11px " + family;
  if (item.cls === "pkg") return "10px " + family;
  return "12px " + family;
}

function createNodeEl(n) {
  const d = n.data;
  const { header, compartments } = buildNodeContent(d);

  let w = 110;
  for (const item of header) w = Math.max(w, textWidth(item.text, fontFor(item)) + 2 * PAD);
  for (const comp of compartments)
    for (const item of comp) w = Math.max(w, textWidth(item.text, fontFor(item)) + 2 * PAD);
  w = Math.ceil(w);

  const g = document.createElementNS(svg.namespaceURI, "g");
  g.classList.add("node");
  if (d.kind.startsWith("requirement")) g.classList.add("req");
  if (d.kind === "actor def" || d.kind === "actor") g.classList.add("actor");
  if (d.kind === "use case def" || d.kind === "use case") g.classList.add("usecase");
  if (d.kind === "action") g.classList.add("action");
  if (d.kind === "control") g.classList.add("control");
  if (d.kind === "decision") g.classList.add("decision");
  // Parts look the same as part defs (no usage tint). Other non-def
  // kinds still get `.usage` unless they have their own class above.
  if (!d.kind.endsWith("def") && d.kind !== "part") g.classList.add("usage");
  g.dataset.id = d.id;

  // decision nodes are empty diamonds (UML/SysML activity control node)
  if (d.kind === "decision") {
    const size = 40;
    const poly = document.createElementNS(svg.namespaceURI, "polygon");
    poly.setAttribute("class", "body");
    poly.setAttribute(
      "points",
      `${size / 2},0 ${size},${size / 2} ${size / 2},${size} 0,${size / 2}`
    );
    g.appendChild(poly);
    n.w = size; n.h = size; n.el = g;
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
    return g;
  }

  const rect = document.createElementNS(svg.namespaceURI, "rect");
  rect.setAttribute("class", "body");
  rect.setAttribute("rx", "6");
  g.appendChild(rect);

  let y = PAD + 12;
  const addText = (item, centered) => {
    const t = document.createElementNS(svg.namespaceURI, "text");
    t.setAttribute("class", item.cls);
    if (item.italic) t.setAttribute("font-style", "italic");
    if (centered) { t.setAttribute("x", w / 2); t.setAttribute("text-anchor", "middle"); }
    else t.setAttribute("x", PAD);
    t.setAttribute("y", y);
    t.textContent = item.text;
    g.appendChild(t);
    y += LINE_H;
  };

  for (const item of header) addText(item, true);
  y -= 4;
  for (const comp of compartments) {
    const sepY = y - 12 + 4;
    const sep = document.createElementNS(svg.namespaceURI, "line");
    sep.setAttribute("class", "sep");
    sep.setAttribute("x1", 0); sep.setAttribute("x2", w);
    sep.setAttribute("y1", sepY); sep.setAttribute("y2", sepY);
    g.appendChild(sep);
    y += 6;
    for (const item of comp) addText(item, false);
    y -= 4;
  }
  const h = y - LINE_H + PAD + 6;
  rect.setAttribute("width", w);
  rect.setAttribute("height", h);
  if (layout.docs && layout.docs[d.id]) {
    const t = document.createElementNS(svg.namespaceURI, "text");
    t.setAttribute("class", "docicon");
    t.setAttribute("x", w - 4);
    t.setAttribute("y", 13);
    t.setAttribute("text-anchor", "end");
    t.textContent = "📄";
    g.appendChild(t);
  }
  if (activityTargetFor(d.id)) {
    const t = document.createElementNS(svg.namespaceURI, "text");
    t.setAttribute("class", "activityicon");
    t.setAttribute("x", 4);
    t.setAttribute("y", 13);
    t.setAttribute("text-anchor", "start");
    t.textContent = "🎬";
    g.appendChild(t);
  }
  n.w = w; n.h = h; n.el = g;
  g.setAttribute("transform", `translate(${n.x},${n.y})`);
  return g;
}

// ---------------------------------------------------------------- edges

function rectAnchor(n, tx, ty) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return { x: cx, y: cy };
  const t = 1 / Math.max(Math.abs(dx) / (n.w / 2), Math.abs(dy) / (n.h / 2));
  return { x: cx + dx * t, y: cy + dy * t };
}

function updateEdge(e) {
  const a = nodes[e.data.from], b = nodes[e.data.to];
  if (!a || !b) return;
  let ax = a.x + a.w / 2, ay = a.y + a.h / 2;
  let bx = b.x + b.w / 2, by = b.y + b.h / 2;
  if (e.off) {
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
    const px = -dy / len * e.off, py = dx / len * e.off;
    ax += px; ay += py; bx += px; by += py;
  }
  const p1 = rectAnchor(a, bx, by);
  let p2 = rectAnchor(b, ax, ay);
  e.hit.setAttribute("x1", p1.x); e.hit.setAttribute("y1", p1.y);
  e.hit.setAttribute("x2", p2.x); e.hit.setAttribute("y2", p2.y);
  if (e.data.kind === "specialization") {
    // pull the line end back so the hollow triangle marker fills the gap
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
    p2 = { x: p2.x - dx / len * 14, y: p2.y - dy / len * 14 };
  }
  e.line.setAttribute("x1", p1.x); e.line.setAttribute("y1", p1.y);
  e.line.setAttribute("x2", p2.x); e.line.setAttribute("y2", p2.y);
  if (e.label) {
    e.label.setAttribute("x", (p1.x + p2.x) / 2 + 5);
    e.label.setAttribute("y", (p1.y + p2.y) / 2 - 5);
  }
}

function createEdgeEl(data) {
  const g = document.createElementNS(svg.namespaceURI, "g");
  g.setAttribute("class", "edge " + data.kind);
  g.dataset.key = edgeKey(data);
  const hit = document.createElementNS(svg.namespaceURI, "line");
  hit.setAttribute("class", "hit");
  g.appendChild(hit);
  const line = document.createElementNS(svg.namespaceURI, "line");
  line.setAttribute("class", "wire");
  if (data.kind === "specialization") line.setAttribute("marker-end", "url(#mTriangle)");
  if (data.kind === "composition") line.setAttribute("marker-start", "url(#mDiamond)");
  if (data.kind === "typing") line.setAttribute("marker-end", "url(#mOpen)");
  if (data.kind === "satisfy") line.setAttribute("marker-end", "url(#mOpenSat)");
  if (data.kind === "verify") line.setAttribute("marker-end", "url(#mOpen)");
  if (data.kind === "connector") {
    line.setAttribute("marker-start", "url(#mBall)");
    line.setAttribute("marker-end", "url(#mBall)");
  }
  g.appendChild(line);
  let label = null;
  // connector labels (a connection's name and/or the two port names) are
  // the edge's actual content — unlike composition/typing/satisfy, whose
  // relationship is already conveyed by arrow style, a connector without
  // its label is just an unlabeled line between two boxes. So connectors
  // stay exempt from the edge-labels Display toggle below. Flow guards
  // (yes/no after a decide) are also always shown.
  if (data.label && (displayOpts().edgeLabels || data.kind === "connector"
      || data.kind === "flow")) {
    label = document.createElementNS(svg.namespaceURI, "text");
    label.textContent = data.label;
    g.appendChild(label);
  }
  return { data, el: g, hit, line, label, off: 0 };
}

function updateAllEdges() { for (const e of edges) updateEdge(e); }

// ---------------------------------------------------------------- legend

const LEGEND_ORDER = ["specialization", "composition", "typing", "satisfy", "verify", "connector", "association"];
const LEGEND_LABELS = {
  specialization: "kind of",
  composition: "composition (has part)",
  typing: "is a",
  satisfy: "satisfies requirement",
  verify: "verifies requirement",
  connector: "connector",
  association: "association (actor/subject ↔ use case)",
};

function legendRow(kind) {
  const dashed = kind === "typing" || kind === "satisfy" || kind === "verify";
  const color = kind === "satisfy" ? "#a08000"
    : kind === "verify" ? "#1a6aa8"
    : kind === "connector" ? "#2a8f4d"
    : kind === "association" ? "#6a3fa0"
    : "#555";
  let marker = "";
  if (kind === "specialization") marker = 'marker-end="url(#mTriangle)"';
  if (kind === "composition") marker = 'marker-start="url(#mDiamond)"';
  if (kind === "typing") marker = 'marker-end="url(#mOpen)"';
  if (kind === "satisfy") marker = 'marker-end="url(#mOpenSat)"';
  if (kind === "verify") marker = 'marker-end="url(#mOpen)"';
  if (kind === "connector") marker = 'marker-start="url(#mBall)" marker-end="url(#mBall)"';
  return '<div class="lrow"><svg width="66" height="14">' +
    `<line x1="2" y1="7" x2="48" y2="7" stroke="${color}" stroke-width="1.2" ` +
    (dashed ? 'stroke-dasharray="5 4" ' : "") + marker + "/></svg>" +
    `<span>${LEGEND_LABELS[kind]}</span></div>`;
}

function updateLegend() {
  const box = document.getElementById("legend");
  const kinds = new Set(edges.map(e => e.data.kind));
  const rows = LEGEND_ORDER.filter(k => kinds.has(k));
  if (!rows.length) {
    box.style.display = "none";
    return;
  }
  box.innerHTML = rows.map(legendRow).join("");
  box.style.display = "block";
}

// ---------------------------------------------------------------- layout

function autoPlace(force) {
  // longest-path layering: children below parents, part types below owners
  const rank = {};
  for (const id in nodes) rank[id] = 0;
  for (let i = 0; i < model.nodes.length + 2; i++) {
    let changed = false;
    for (const e of model.edges) {
      if (!(e.from in rank) || !(e.to in rank)) continue;
      const down = e.kind === "composition" || e.kind === "satisfy";
      const lower = down ? e.to : e.from;
      const upper = down ? e.from : e.to;
      if (rank[lower] < rank[upper] + 1) { rank[lower] = rank[upper] + 1; changed = true; }
    }
    if (!changed) break;
  }
  const rows = {};
  for (const id in nodes) (rows[rank[id]] = rows[rank[id]] || []).push(id);
  const GAPX = 60, GAPY = 90;
  let yCursor = 0;
  for (const r of Object.keys(rows).sort((a, b) => a - b)) {
    const ids = rows[r];
    let rowW = 0, rowH = 0;
    for (const id of ids) { rowW += nodes[id].w + GAPX; rowH = Math.max(rowH, nodes[id].h); }
    rowW -= GAPX;
    let x = -rowW / 2;
    for (const id of ids) {
      const n = nodes[id];
      if (force || !(id in posMap())) { n.x = x; n.y = yCursor; }
      x += n.w + GAPX;
    }
    yCursor += rowH + GAPY;
  }
  for (const id in nodes) {
    const n = nodes[id];
    n.el.setAttribute("transform", `translate(${n.x},${n.y})`);
  }
}

function fitView() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const id in nodes) {
    const n = nodes[id];
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  if (minX === Infinity) return;
  const treeW = treeVisible() ? TREE_WIDTH : 0;
  const top = chromeTop();
  const cw = svg.clientWidth - treeW, ch = svg.clientHeight - top;
  const s = Math.min(1.5, 0.9 * Math.min(cw / (maxX - minX + 1), ch / (maxY - minY + 1)));
  view.s = s;
  view.tx = treeW + cw / 2 - s * (minX + maxX) / 2;
  view.ty = top + ch / 2 - s * (minY + maxY) / 2;
  applyView();
}

function centerOn(id) {
  const n = nodes[id];
  if (!n) return;
  const treeW = treeVisible() ? TREE_WIDTH : 0;
  const top = chromeTop();
  const cw = svg.clientWidth - treeW, ch = svg.clientHeight - top;
  view.tx = treeW + cw / 2 - view.s * (n.x + n.w / 2);
  view.ty = top + ch / 2 - view.s * (n.y + n.h / 2);
  applyView();
}

function applyView() {
  world.setAttribute("transform",
    `translate(${view.tx},${view.ty}) scale(${view.s})`);
}

// Zoom around a client point (mouse wheel, pinch, or the on-screen buttons).
function zoomAtClient(clientX, clientY, factor) {
  if (!factor || !isFinite(factor)) return;
  const r = svg.getBoundingClientRect();
  const mx = clientX - r.left, my = clientY - r.top;
  view.tx = mx - (mx - view.tx) * factor;
  view.ty = my - (my - view.ty) * factor;
  view.s *= factor;
  applyView();
}

// + / − zoom around the center of the diagram that is still visible.
// The detail sheet covers at most the bottom half, so the anchor stays
// in the part of the canvas the sheet is not covering.
function zoomBy(factor) {
  const r = svg.getBoundingClientRect();
  let bottom = r.bottom;
  if (document.body.classList.contains("sheet")) {
    const sr = document.getElementById("sheet").getBoundingClientRect();
    if (sr.height > 0 && sr.top < bottom) bottom = Math.max(r.top + 48, sr.top);
  }
  zoomAtClient(r.left + r.width / 2, (r.top + bottom) / 2, factor);
}

// restore the active View's own pan/zoom, falling back to fitting the content
function restoreViewTransform() {
  const saved = activeView && activeView.view;
  if (saved) { view = { ...saved }; applyView(); }
  else fitView();
}

// persist the outgoing View's state before switching away from it, so
// unsaved edits survive navigation instead of being discarded
async function saveIfDirty() {
  if (dirty) await save();
}

// ------------------------------------------------------- activity diagram
//
// A swimlane rendering of a `perform action <name> { ... }` block (see
// app.py's dialect notes): one box per nested action plus two control
// nodes ("start"/"done"), laid out top-to-bottom in succession order and
// grouped into vertical lanes (columns) by which participant part /
// actor / subject `perform`s each action. Dragging an action only moves
// it vertically — its lane (x) is fixed. Not a standard SysML v2 diagram
// type — this tool's own reading of the pattern used in the CoolSpine
// example model.

function activityFor(ownerId) {
  return (model.activities || []).find(a => a.owner === ownerId) || null;
}

// the def whose activity diagram can be opened from element `id`, or null
function activityTargetFor(id) {
  return activityFor(id) ? id : null;
}

function activityNodeId(ownerId, name) { return ownerId + "::act::" + name; }

function activityLaneInfo(act) {
  const laneOfAction = {};
  const laneOrder = [];
  for (const l of act.lanes) {
    if (!laneOrder.includes(l.role)) laneOrder.push(l.role);
    laneOfAction[l.action] = l.role;
  }
  if (act.actions.some(a => !(a.name in laneOfAction))) laneOrder.push("");
  return { laneOfAction, laneOrder };
}

function applyViewKind(v) {
  if (isActivityView(v) && activityFor(v.activityOwner)) {
    mode = "activity";
    activityOwner = v.activityOwner;
    hiddenEdges = new Set();
  } else {
    mode = "bdd";
    activityOwner = null;
    hiddenEdges = new Set((v && v.hiddenEdges) || []);
  }
}

function activityViewName(ownerId) {
  const owner = model.nodes.find(n => n.id === ownerId);
  return "Activity — " + (owner ? owner.name : ownerId.split("::").pop());
}

async function ensureActivityView(ownerId) {
  let v = views.find(x => x.activityOwner === ownerId);
  if (v) return v;
  const res = await fetch("/api/views", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: activityViewName(ownerId),
      kind: "activity",
      activityOwner: ownerId,
      description: "Swimlane activity diagram.",
    }),
  });
  v = await res.json();
  views.push(v);
  views.sort((a, b) => a.name.localeCompare(b.name));
  return v;
}

async function openActivity(ownerId) {
  const v = await ensureActivityView(ownerId);
  await switchToView(v.id);
}

// vertical swimlanes: each role is a column; succession advances downward
const ACT_COL_W = 200, ACT_ROW_H = 110, ACT_MARGIN = 20;
const ACT_LANE_HEADER = 28, ACT_NODE_INSET = 20;

function activityLaneX(col) {
  return ACT_MARGIN + col * ACT_COL_W + ACT_NODE_INSET;
}

function activityDecisions(act) {
  return new Set(act.decisions || []);
}

function activityNodeKind(name, actionNames, decisions) {
  if (actionNames.has(name)) return "action";
  if (decisions.has(name)) return "decision";
  return "control";
}

// longest-path depth from start (for top-to-bottom placement with branches)
function activityDepths(act) {
  const outs = {};
  for (const e of act.edges || []) {
    (outs[e.from] || (outs[e.from] = [])).push(e.to);
  }
  const depths = {};
  const visit = (n, d) => {
    if (depths[n] != null && depths[n] >= d) return;
    depths[n] = d;
    for (const t of outs[n] || []) visit(t, d + 1);
  };
  if ((act.flow || []).includes("start")) visit("start", 0);
  for (const n of act.flow || []) {
    if (depths[n] == null) depths[n] = 0;
  }
  return depths;
}

// the parser always fills `edges` (inferring a linear chain when needed)
function activityFlowEdges(act) {
  return act.edges || [];
}

// action boxes + control/decision nodes, and succession edges
function buildActivityNodesEdges() {
  const act = activityFor(activityOwner);
  if (!act) return;
  const actionNames = new Set(act.actions.map(a => a.name));
  const decisions = activityDecisions(act);
  const { laneOfAction } = activityLaneInfo(act);

  const docByName = {};
  for (const a of act.actions) docByName[a.name] = a.doc;

  for (const name of act.flow) {
    const id = activityNodeId(activityOwner, name);
    const kind = activityNodeKind(name, actionNames, decisions);
    const d = {
      id,
      name: kind === "action" ? name
        : kind === "decision" ? name
        : (name === "start" ? "▶ start" : "⏹ " + name),
      kind, shortName: null, abstract: false,
      package: kind === "action" ? (laneOfAction[name] || "") : "",
      attributes: [], parts: [],
      doc: kind === "action" ? docByName[name] : null,
    };
    const saved = posMap()[id];
    const n = { data: d, x: saved ? saved.x : 0, y: saved ? saved.y : 0, w: 0, h: 0,
                laneX: null };
    nodes[id] = n;
    nodeLayer.appendChild(createNodeEl(n));
  }
  for (const fe of activityFlowEdges(act)) {
    const from = activityNodeId(activityOwner, fe.from);
    const to = activityNodeId(activityOwner, fe.to);
    const e = createEdgeEl({ kind: "flow", from, to, label: fe.label || "" });
    edges.push(e);
    edgeLayer.appendChild(e.el);
  }
  autoPlaceActivity(false);
}

// grid layout: columns are swimlanes, rows follow succession depth —
// only fills in y positions that aren't already saved, unless force.
// Lane (x) is always snapped so actions cannot sit in the wrong column.
// Decision nodes sit in the same lane as their unique predecessor action
// when possible. Also (re)draws the lane backgrounds.
function autoPlaceActivity(force) {
  const act = activityFor(activityOwner);
  if (!act) return;
  const actionNames = new Set(act.actions.map(a => a.name));
  const decisions = activityDecisions(act);
  const { laneOfAction, laneOrder } = activityLaneInfo(act);
  const colOf = {};
  laneOrder.forEach((role, i) => { colOf[role] = i; });
  const controlCol = laneOrder.length ? (laneOrder.length - 1) / 2 : 0;
  const depths = activityDepths(act);
  const preds = {};
  for (const e of activityFlowEdges(act)) {
    (preds[e.to] || (preds[e.to] = [])).push(e.from);
  }

  const colFor = (name) => {
    const kind = activityNodeKind(name, actionNames, decisions);
    if (kind === "action") return colOf[laneOfAction[name] || ""] ?? 0;
    if (kind === "decision") {
      const ps = preds[name] || [];
      if (ps.length === 1 && actionNames.has(ps[0])) {
        return colOf[laneOfAction[ps[0]] || ""] ?? controlCol;
      }
      return controlCol;
    }
    return controlCol;
  };

  let maxDepth = 0;
  for (const name of act.flow) {
    const id = activityNodeId(activityOwner, name);
    const n = nodes[id];
    if (!n) continue;
    const depth = depths[name] || 0;
    maxDepth = Math.max(maxDepth, depth);
    const laneX = activityLaneX(colFor(name));
    n.laneX = laneX;
    n.el.dataset.laneX = String(laneX);
    n.x = laneX;
    if (force || !(id in posMap())) {
      n.y = ACT_MARGIN + ACT_LANE_HEADER + depth * ACT_ROW_H;
    } else {
      n.y = posMap()[id].y;
    }
    n.el.setAttribute("transform", `translate(${n.x},${n.y})`);
    posMap()[id] = { x: n.x, y: n.y };
  }

  laneLayer.innerHTML = "";
  if (!laneOrder.length) return;
  const height = ACT_MARGIN + ACT_LANE_HEADER
    + Math.max(1, maxDepth + 1) * ACT_ROW_H;
  laneOrder.forEach((role, i) => {
    const g = document.createElementNS(svg.namespaceURI, "g");
    g.setAttribute("class", "lane");
    const rect = document.createElementNS(svg.namespaceURI, "rect");
    rect.setAttribute("x", ACT_MARGIN + i * ACT_COL_W - 8);
    rect.setAttribute("y", ACT_MARGIN - 8);
    rect.setAttribute("width", ACT_COL_W);
    rect.setAttribute("height", height);
    rect.setAttribute("fill", i % 2 === 0 ? "#f7f9fc" : "#eef2f7");
    g.appendChild(rect);
    const label = document.createElementNS(svg.namespaceURI, "text");
    label.setAttribute("x", ACT_MARGIN + i * ACT_COL_W + ACT_COL_W / 2 - 8);
    label.setAttribute("y", ACT_MARGIN);
    label.textContent = role || "(unassigned)";
    g.appendChild(label);
    laneLayer.appendChild(g);
  });
}

// ---------------------------------------------------------------- build

function buildBddNodesEdges() {
  const vis = visibleIds();
  const suppressed = suppressedSingletonUsages(vis);
  for (const d of model.nodes) {
    if (!vis.has(d.id) || suppressed.has(d.id)) continue;
    const saved = posMap()[d.id];
    const n = { data: d, x: saved ? saved.x : 0, y: saved ? saved.y : 0, w: 0, h: 0 };
    nodes[d.id] = n;
    nodeLayer.appendChild(createNodeEl(n));
  }
  // a type-level edge is redundant once the usage node it stands for is on
  // the diagram: `FluidReservoir ◆── Thermistor (inputTempSensor)` says the
  // same thing as `FluidReservoir ◆── inputTempSensor ▷ Thermistor`, and a
  // connector between two types duplicates the one between their usages
  const shown = model.edges.filter(d =>
    d.from in nodes && d.to in nodes && !hiddenEdges.has(edgeKey(d))
    && !(d.usageId && d.usageId in nodes)
    && !(d.fromUsage && d.fromUsage in nodes && d.toUsage in nodes));
  const pairCount = {};
  for (const d of shown) {
    const key = [d.from, d.to].sort().join("|");
    pairCount[key] = (pairCount[key] || 0) + 1;
  }
  const pairSeen = {};
  for (const d of shown) {
    const e = createEdgeEl(d);
    const key = [d.from, d.to].sort().join("|");
    const i = (pairSeen[key] = (pairSeen[key] || 0) + 1);
    if (pairCount[key] > 1) e.off = (i - 1 - (pairCount[key] - 1) / 2) * 16;
    edges.push(e);
    edgeLayer.appendChild(e.el);
  }
}

// ---------------------------------------------------------------- element tree

// group model.nodes into a tree keyed by packagePath segments; nodes with
// no packagePath (declared outside any package) collect at the root
function packageTree(nodeList) {
  const root = { children: new Map(), elems: [] };
  for (const n of nodeList) {
    let cur = root;
    for (const part of (n.packagePath || "").split("::").filter(Boolean)) {
      if (!cur.children.has(part))
        cur.children.set(part, { children: new Map(), elems: [] });
      cur = cur.children.get(part);
    }
    cur.elems.push(n);
  }
  return root;
}

function treeDotClass(kind) {
  if (kind.startsWith("requirement")) return "k-req";
  if (kind === "actor def" || kind === "actor") return "k-actor";
  if (kind === "use case def" || kind === "use case") return "k-usecase";
  // Parts match part defs (uncolored); other non-def kinds stay blue.
  if (!kind.endsWith("def") && kind !== "part") return "k-usage";
  return "";
}

function treeKindMatch(kind, filter) {
  if (filter === "all") return true;
  if (filter === "req") return kind.startsWith("requirement");
  if (filter === "actor") return kind === "actor def" || kind === "actor";
  if (filter === "usecase") return kind === "use case def" || kind === "use case";
  if (filter === "part")
    return kind === "part def" || kind === "part"
      || kind === "item def" || kind === "item"
      || kind === "port def" || kind === "port"
      || kind === "action def" || kind === "action";
  return true;
}

function filterTreeNodes(nodeList) {
  const hide = singletonPartUsageIds();
  const q = treeQuery.trim().toLowerCase();
  return nodeList.filter(n => {
    // singleton part usages are represented by their part def only
    if (hide.has(n.id)) return false;
    if (!treeKindMatch(n.kind, treeKind)) return false;
    if (!q) return true;
    return n.name.toLowerCase().includes(q)
      || (n.shortName && n.shortName.toLowerCase().includes(q))
      || (n.id && n.id.toLowerCase().includes(q));
  });
}

function renderTreeElem(n, container) {
  const row = document.createElement("div");
  const isMember = (activeView.elements || []).includes(n.id);
  const classes = ["elem"];
  const dotCls = treeDotClass(n.kind);
  if (dotCls) classes.push(dotCls);
  if (!isMember) classes.push("dimmed");
  row.className = classes.join(" ");
  row.title = isMember ? "" : "not in this view — check to add it";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = isMember;
  cb.toggleAttribute("checked", isMember);
  cb.disabled = mode !== "bdd";
  cb.addEventListener("change", () => {
    if (cb.checked) {
      if (!activeView.elements.includes(n.id)) activeView.elements.push(n.id);
    } else {
      activeView.elements = activeView.elements.filter(id => id !== n.id);
    }
    rebuild();
    setDirty(true);
  });
  const dot = document.createElement("span");
  dot.className = "dot";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = n.name;
  lbl.addEventListener("click", () => {
    if (mode !== "bdd") return;
    selectNode(n.id);
    if (n.id in nodes) centerOn(n.id);
  });
  row.appendChild(cb);
  row.appendChild(dot);
  row.appendChild(lbl);
  container.appendChild(row);
}

// every element under a tree node, including nested subpackages
function allElemsUnder(node) {
  let out = node.elems.slice();
  for (const child of node.children.values()) out = out.concat(allElemsUnder(child));
  return out;
}

function renderTreePkg(name, node, container, forceOpen) {
  const descendants = allElemsUnder(node);
  const members = new Set(activeView.elements || []);
  const visibleCount = descendants.filter(n => members.has(n.id)).length;
  const allVisible = descendants.length > 0 && visibleCount === descendants.length;

  const hdr = document.createElement("div");
  hdr.className = "pkg";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = allVisible;
  cb.toggleAttribute("checked", allVisible);
  cb.indeterminate = visibleCount > 0 && !allVisible;
  cb.disabled = mode !== "bdd" || !descendants.length;
  cb.title = "Add/remove every element in this package";
  // a click on the checkbox shouldn't also toggle the header's collapse
  cb.addEventListener("click", evt => evt.stopPropagation());
  cb.addEventListener("change", () => {
    const ids = descendants.map(n => n.id);
    if (cb.checked) {
      for (const id of ids)
        if (!activeView.elements.includes(id)) activeView.elements.push(id);
    } else {
      const idSet = new Set(ids);
      activeView.elements = activeView.elements.filter(id => !idSet.has(id));
    }
    rebuild();
    setDirty(true);
  });
  hdr.appendChild(cb);
  const tri = document.createElement("span");
  tri.className = "tri";
  tri.textContent = "▾";
  hdr.appendChild(tri);
  hdr.appendChild(document.createTextNode(name));
  const body = document.createElement("div");
  body.className = "pkg-body";
  hdr.addEventListener("click", () => {
    const collapsed = body.classList.toggle("collapsed");
    tri.textContent = collapsed ? "▸" : "▾";
  });
  container.appendChild(hdr);
  container.appendChild(body);
  renderTreeNode(node, body, forceOpen);
}

function renderTreeNode(node, container, forceOpen) {
  for (const [name, child] of [...node.children.entries()].sort((a, b) => a[0].localeCompare(b[0])))
    renderTreePkg(name, child, container, forceOpen);
  for (const n of [...node.elems].sort((a, b) => a.name.localeCompare(b.name)))
    renderTreeElem(n, container);
}

function renderTree() {
  const body = document.getElementById("treeBody");
  body.innerHTML = "";
  treeEl.classList.toggle("disabled", mode !== "bdd");
  if (!model) return;
  const filtered = filterTreeNodes(model.nodes);
  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "elem dimmed";
    empty.style.padding = "8px 12px";
    empty.textContent = treeQuery || treeKind !== "all"
      ? "No matching elements" : "No elements in model";
    body.appendChild(empty);
    return;
  }
  // while filtering, keep packages expanded so matches are visible
  const forceOpen = !!(treeQuery.trim() || treeKind !== "all");
  renderTreeNode(packageTree(filtered), body, forceOpen);
}

// The element tree is a custom-diagram building control, so it is only on
// screen when the tree is open AND expert mode is on. treeOpen stays the
// user's preference either way, so unlocking expert mode restores it.
function treeVisible() { return expertMode && treeOpen; }

function applyTreePanel() {
  const shown = treeVisible();
  treeEl.classList.toggle("hidden", !shown);
  // keep the legend from sitting under the tree panel's bottom-left corner
  document.getElementById("legend").style.left = (shown ? TREE_WIDTH + 12 : 12) + "px";
}

function setTreeOpen(open) {
  treeOpen = open;
  applyTreePanel();
}

// Edit is the extra option on top of the reader page. It gates diagram
// building (tree, new/rename/delete view, Unhide) and the authoring
// controls (Save, Revert, the view switcher), and it is what allows
// elements to be dragged. Display, More, Fit, pan, and zoom stay
// available either way. The flag is still layout.expertMode.
function setExpertMode(on) {
  expertMode = !!on;
  document.body.classList.toggle("expert", expertMode);
  const btn = document.getElementById("expertBtn");
  btn.classList.toggle("on", expertMode);
  btn.setAttribute("aria-pressed", expertMode ? "true" : "false");
  btn.title = expertMode
    ? "Edit on — click to go back to reading"
    : "Edit — move elements and change views";
  if (expertMode) hideSheet();
  chromeTop();
  applyTreePanel();
  updateEmptyHint();
}

function updateEmptyHint() {
  const hint = document.getElementById("emptyHint");
  const empty = mode === "bdd" && model && activeView
    && !(activeView.elements || []).some(id => model.nodes.some(n => n.id === id));
  hint.textContent = expertMode
    ? "This view is empty. Check elements in the tree to add them."
    : "This view is empty. Turn Edit on to add elements.";
  hint.classList.toggle("hidden", !empty);
}

function rebuild() {
  nodeLayer.innerHTML = "";
  edgeLayer.innerHTML = "";
  nodes = {}; edges = [];
  laneLayer.innerHTML = "";
  if (mode === "activity") buildActivityNodesEdges();
  else buildBddNodesEdges();
  unhideBtn.textContent = hiddenEdges.size
    ? `Unhide connections (${hiddenEdges.size})` : "Unhide connections";
  unhideBtn.disabled = mode !== "bdd" || !hiddenEdges.size;
  updateLegend();
  autoPlace(false);
  updateAllEdges();
  applySelection();
  renderTree();
  updateEmptyHint();
}

// ---------------------------------------------------------------- selection / highlight

// left-click highlight: a selected element gets "sel", everything it's
// wired to (edges + their other endpoint) gets "hl". A selected connection
// gets "sel" itself and its two endpoint elements get "hl". Purely a view
// aid — not persisted to the layout.
function clearHighlightClasses() {
  for (const id in nodes) nodes[id].el.classList.remove("sel", "hl");
  for (const e of edges) e.el.classList.remove("sel", "hl");
}

function applySelection() {
  clearHighlightClasses();
  if (!selection) return;
  if (selection.type === "node") {
    const n = nodes[selection.id];
    if (!n) { selection = null; return; }
    n.el.classList.add("sel");
    for (const e of edges) {
      if (e.data.from !== selection.id && e.data.to !== selection.id) continue;
      e.el.classList.add("hl");
      const other = nodes[e.data.from === selection.id ? e.data.to : e.data.from];
      if (other) other.el.classList.add("hl");
    }
  } else {
    const e = edges.find(x => edgeKey(x.data) === selection.key);
    if (!e) { selection = null; return; }
    e.el.classList.add("sel");
    const a = nodes[e.data.from], b = nodes[e.data.to];
    if (a) a.el.classList.add("hl");
    if (b) b.el.classList.add("hl");
  }
}

function selectNode(id) { selection = { type: "node", id }; applySelection(); }
function selectEdge(key) { selection = { type: "edge", key }; applySelection(); }
function clearSelection() { selection = null; clearHighlightClasses(); }

// ---------------------------------------------------------------- interaction

let drag = null; // {kind: "node"|"pan", ...}
const activePointers = new Map();
let pinchDist = 0;
// Set when a press turned into a pan, so the click that follows does not
// also open or close the detail sheet.
let gestureMoved = false;

function toWorld(evt) {
  const r = svg.getBoundingClientRect();
  return { x: (evt.clientX - r.left - view.tx) / view.s,
           y: (evt.clientY - r.top - view.ty) / view.s };
}

function finishDrag() {
  if (!drag) return;
  if (drag.kind === "node") drag.n.el.classList.remove("dragging");
  // A drag pans and leaves the detail sheet up. A tap (no movement) falls
  // through to the click handler, which opens or closes the sheet.
  if (drag.kind === "pan" && drag.moved) {
    gestureMoved = true;
    setTimeout(() => { gestureMoved = false; }, 700);
  }
  svg.classList.remove("panning");
  drag = null;
}

svg.addEventListener("pointerdown", evt => {
  if (evt.pointerType === "mouse" && evt.button !== 0) return;
  activePointers.set(evt.pointerId, true);
  if (activePointers.size >= 2) {
    // second finger: the touch handlers pinch-zoom; this press is not a pan
    if (drag && drag.kind === "node") drag.n.el.classList.remove("dragging");
    svg.classList.remove("panning");
    drag = null;
    return;
  }
  const nodeEl = evt.target.closest(".node");
  if (nodeEl) {
    if (!expertMode) {
      // Reading: a tap opens the sheet, a drag pans — even when it starts
      // on a node, which is most of the screen on a phone. The sheet stays
      // open while the diagram moves.
      drag = { kind: "pan", pointerId: evt.pointerId, pointerType: evt.pointerType,
               sx: evt.clientX, sy: evt.clientY,
               tx: view.tx, ty: view.ty, moved: false };
      return;
    }
    selectNode(nodeEl.dataset.id);
    hideSheet();
    const n = nodes[nodeEl.dataset.id];
    const p = toWorld(evt);
    drag = { kind: "node", pointerId: evt.pointerId, n, dx: p.x - n.x,
             dy: p.y - n.y, startX: evt.clientX, startY: evt.clientY,
             moved: false };
    nodeEl.classList.add("dragging");
    nodeLayer.appendChild(nodeEl); // raise to front
    return;
  }
  const edgeEl = evt.target.closest(".edge");
  if (edgeEl && !expertMode) {
    drag = { kind: "pan", pointerId: evt.pointerId, pointerType: evt.pointerType,
             sx: evt.clientX, sy: evt.clientY,
             tx: view.tx, ty: view.ty, moved: false };
    return;
  }
  if (edgeEl) {
    selectEdge(edgeEl.dataset.key);
    return;
  }
  if (expertMode) { clearSelection(); hideSheet(); }
  drag = { kind: "pan", pointerId: evt.pointerId, pointerType: evt.pointerType,
           sx: evt.clientX, sy: evt.clientY, tx: view.tx, ty: view.ty,
           moved: false };
});

window.addEventListener("pointermove", evt => {
  if (!activePointers.has(evt.pointerId)) return;
  if (activePointers.size >= 2 || !drag || evt.pointerId !== drag.pointerId)
    return;
  if (drag.kind === "node") {
    if (!drag.moved) {
      // below this threshold it's a click, not a drag
      if (Math.hypot(evt.clientX - drag.startX, evt.clientY - drag.startY) < 4)
        return;
      drag.moved = true;
    }
    const p = toWorld(evt);
    // activity actions/controls stay in their swimlane column; only y moves
    if (mode === "activity" && drag.n.laneX != null) {
      drag.n.x = drag.n.laneX;
      drag.n.y = Math.round(p.y - drag.dy);
    } else {
      drag.n.x = Math.round(p.x - drag.dx);
      drag.n.y = Math.round(p.y - drag.dy);
    }
    drag.n.el.setAttribute("transform", `translate(${drag.n.x},${drag.n.y})`);
    posMap()[drag.n.data.id] = { x: drag.n.x, y: drag.n.y };
    updateAllEdges();
    setDirty(true);
  } else {
    const dx = evt.clientX - drag.sx, dy = evt.clientY - drag.sy;
    if (!drag.moved) {
      // a finger jitters; a mouse click does not. Past this, it's a pan
      // and the detail sheet stays open.
      const slop = drag.pointerType === "mouse" ? 2 : 8;
      if (Math.hypot(dx, dy) < slop) return;
      drag.moved = true;
      svg.classList.add("panning");
    }
    view.tx = drag.tx + dx;
    view.ty = drag.ty + dy;
    applyView();
  }
});

function releasePointer(evt, cancelled) {
  const tracked = activePointers.has(evt.pointerId);
  activePointers.delete(evt.pointerId);
  if (!tracked) return;
  if (activePointers.size > 0) return;
  if (cancelled) {
    if (drag && drag.kind === "node") drag.n.el.classList.remove("dragging");
    svg.classList.remove("panning");
    drag = null;
    return;
  }
  finishDrag();
}
window.addEventListener("pointerup", evt => releasePointer(evt, false));
window.addEventListener("pointercancel", evt => releasePointer(evt, true));
svg.addEventListener("click", evt => {
  if (gestureMoved) {
    gestureMoved = false;
    evt.preventDefault();
    evt.stopPropagation();
    return;
  }
  if (expertMode) return;
  const nodeEl = evt.target.closest(".node");
  if (nodeEl) {
    selectNode(nodeEl.dataset.id);
    showSheet(nodeEl.dataset.id);
    return;
  }
  const edgeEl = evt.target.closest(".edge");
  if (edgeEl) { selectEdge(edgeEl.dataset.key); return; }
  clearSelection();
  hideSheet();
});

// Two-finger pinch zooms the diagram, including while the detail sheet is
// open (the fingers are often on the sheet, not on the canvas).
function touchDistance(touches) {
  return Math.hypot(touches[0].clientX - touches[1].clientX,
                     touches[0].clientY - touches[1].clientY);
}
document.addEventListener("touchstart", evt => {
  if (document.body.classList.contains("home-open")) return;
  if (evt.touches.length < 2) return;
  if (drag && drag.kind === "node") drag.n.el.classList.remove("dragging");
  svg.classList.remove("panning");
  drag = null;
  pinchDist = touchDistance(evt.touches);
  evt.preventDefault();
}, { passive: false });
document.addEventListener("touchmove", evt => {
  if (evt.touches.length >= 2 && pinchDist > 0) {
    const dist = touchDistance(evt.touches);
    if (dist > 0) {
      zoomAtClient((evt.touches[0].clientX + evt.touches[1].clientX) / 2,
                   (evt.touches[0].clientY + evt.touches[1].clientY) / 2,
                   dist / pinchDist);
      pinchDist = dist;
    }
    evt.preventDefault();
    return;
  }
  // a one-finger drag on the diagram must not turn into a page scroll
  if (drag && drag.moved && evt.cancelable) evt.preventDefault();
}, { passive: false });
document.addEventListener("touchend", evt => {
  if (evt.touches.length < 2) pinchDist = 0;
});
document.addEventListener("touchcancel", evt => {
  if (evt.touches.length < 2) pinchDist = 0;
});

// ---------------------------------------------------------------- context menu

const ctxmenu = document.getElementById("ctxmenu");

function showMenu(x, y, items) {
  ctxmenu.innerHTML = "";
  for (const it of items) {
    if (it.sep) {
      const s = document.createElement("div");
      s.className = "sep";
      ctxmenu.appendChild(s);
      continue;
    }
    const d = document.createElement("div");
    d.className = "item" + (it.disabled ? " disabled" : "");
    d.textContent = it.label;
    if (!it.disabled)
      d.addEventListener("click", () => { hideMenu(); it.action(); });
    ctxmenu.appendChild(d);
  }
  ctxmenu.style.display = "block";
  ctxmenu.style.left = Math.min(x, window.innerWidth - ctxmenu.offsetWidth - 4) + "px";
  ctxmenu.style.top = Math.min(y, window.innerHeight - ctxmenu.offsetHeight - 4) + "px";
}

function hideMenu() { ctxmenu.style.display = "none"; }

window.addEventListener("mousedown", evt => {
  if (!ctxmenu.contains(evt.target)) hideMenu();
}, true);
window.addEventListener("keydown", evt => {
  if (evt.key === "Escape") { hideMenu(); clearSelection(); hideSheet(); }
});

// ---- generic modal dialog (used by the documentation-link file browser) ----
const modalOverlay = document.getElementById("modalOverlay");
const modalHead = document.getElementById("modalHead");
const modalBody = document.getElementById("modalBody");
const modalFoot = document.getElementById("modalFoot");

function closeModal() {
  modalOverlay.classList.add("hidden");
  modalBody.innerHTML = "";
  modalFoot.innerHTML = "";
}
modalOverlay.addEventListener("mousedown", evt => {
  if (evt.target === modalOverlay) closeModal();
});
window.addEventListener("keydown", evt => {
  if (evt.key === "Escape" && !modalOverlay.classList.contains("hidden")) closeModal();
});

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Opens the "Add/Edit documentation link" dialog for element `id`, with
// `initial` pre-filled in the path/URL field (the existing link, or a path
// just picked via the folder browser).
function openDocDialog(id, initial) {
  modalHead.textContent = initial ? "Edit documentation link" : "Add documentation link";
  modalBody.innerHTML = `
    <p>Path or URL of the documentation (e.g. a PDF). Relative paths are
    resolved from the model file's folder. Leave empty to remove the link.</p>
    <input type="text" id="docPathInput" value="${escapeHtml(initial || "")}">
    <div style="margin-top:8px"><button type="button" id="browseBtn">Browse folder…</button></div>
  `;
  modalFoot.innerHTML = `
    <button type="button" id="docCancelBtn">Cancel</button>
    <button type="button" id="docOkBtn">OK</button>
  `;
  const input = document.getElementById("docPathInput");
  const submit = () => {
    const v = input.value.trim();
    if (v) layout.docs[id] = v; else delete layout.docs[id];
    rebuild();
    setDirty(true);
    closeModal();
  };
  input.addEventListener("keydown", evt => { if (evt.key === "Enter") submit(); });
  document.getElementById("docCancelBtn").onclick = closeModal;
  document.getElementById("docOkBtn").onclick = submit;
  document.getElementById("browseBtn").onclick = () => {
    const current = input.value.trim();
    openFileBrowser(
      picked => openDocDialog(id, picked),
      () => openDocDialog(id, current),
    );
  };
  modalOverlay.classList.remove("hidden");
  input.focus();
}

// Folder-tree browser rooted at the model's working folder (served by
// /api/browse, which refuses to list anything outside it). `onPick(path)`
// fires with a relative, forward-slash path when a file is clicked;
// `onCancel()` fires on Cancel/back.
async function openFileBrowser(onPick, onCancel) {
  let curPath = "";
  async function render() {
    modalHead.textContent = "Choose a file";
    modalBody.innerHTML = `<p>Loading…</p>`;
    let data;
    try {
      const res = await fetch("/api/browse?path=" + encodeURIComponent(curPath));
      if (!res.ok) throw new Error(String(res.status));
      data = await res.json();
    } catch (e) {
      modalBody.innerHTML = `<p>Could not list folder contents.</p>`;
      return;
    }
    curPath = data.path;
    const upRow = curPath
      ? `<div class="row" data-up="1">⬆ .. (up)</div>` : "";
    const rows = data.entries.map(e => `
      <div class="row" data-name="${escapeHtml(e.name)}" data-dir="${e.isDir}">
        ${e.isDir ? "📁" : "📄"} ${escapeHtml(e.name)}
      </div>`).join("");
    modalBody.innerHTML = `
      <div id="browsePath">/${escapeHtml(curPath)}</div>
      <div id="browseList">${upRow}${rows ||
        '<div class="row empty">(empty folder)</div>'}</div>
    `;
    const list = document.getElementById("browseList");
    const upEl = list.querySelector('.row[data-up]');
    if (upEl) upEl.onclick = () => {
      curPath = curPath.split("/").slice(0, -1).join("/");
      render();
    };
    list.querySelectorAll(".row[data-name]").forEach(row => {
      row.onclick = () => {
        const name = row.dataset.name;
        const isDir = row.dataset.dir === "true";
        const next = curPath ? curPath + "/" + name : name;
        if (isDir) { curPath = next; render(); }
        else onPick(next);
      };
    });
  }
  modalFoot.innerHTML = `<button type="button" id="browseCancelBtn">Cancel</button>`;
  document.getElementById("browseCancelBtn").onclick = onCancel;
  modalOverlay.classList.remove("hidden");
  await render();
}

// ------------------------------------------------- related-element lookup

// part-def id → part usage node ids (typing edges only). Ignores
// port/requirement typing (from is not kind "part").
function partUsagesByTypeId() {
  const byId = Object.fromEntries(model.nodes.map(n => [n.id, n]));
  const map = new Map();
  for (const e of model.edges) {
    if (e.kind !== "typing") continue;
    const usage = byId[e.from];
    const type = byId[e.to];
    if (!usage || usage.kind !== "part") continue;
    if (!type || type.kind !== "part def") continue;
    const list = map.get(e.to) || [];
    list.push(e.from);
    map.set(e.to, list);
  }
  return map;
}

// Usages of a part def that appears only once in the model. Those are
// hidden in the tree / Show usages, and suppressed on the canvas when the
// def is also a View member (see NOTATION.md N4).
function singletonPartUsageIds() {
  const out = new Set();
  for (const usageIds of partUsagesByTypeId().values()) {
    if (usageIds.length === 1) out.add(usageIds[0]);
  }
  return out;
}

function suppressedSingletonUsages(vis) {
  const suppressed = new Set();
  for (const [typeId, usageIds] of partUsagesByTypeId()) {
    if (usageIds.length !== 1) continue;
    const u = usageIds[0];
    if (vis.has(typeId) && vis.has(u)) suppressed.add(u);
  }
  return suppressed;
}

// ids of the per-usage nodes (`Owner::role`), which sit alongside the def
// nodes rather than replacing them
function usageNodeIds() {
  return new Set(model.nodes.filter(n => n.usageOwner).map(n => n.id));
}

// "Show related" walks the parsed model's own edges outward from one
// element. Pass `transitive: true` to follow a whole tree (specializations);
// direct children only is the default.
// `dir` is "down" to follow edges from→to, "up" for to→from.
// By default usage nodes are skipped (so satisfy/specialization don't mix
// levels). Pass `usagesOnly: true` for decomposition: only the role-level
// composition targets (`Owner::inputTempSensor`), not the shared type def.
function relatedIds(id, kind, dir, {transitive = false, usagesOnly = false} = {}) {
  const usageIds = usageNodeIds();
  const out = new Set();
  const queue = [id];
  while (queue.length) {
    const cur = queue.shift();
    for (const e of model.edges) {
      if (e.kind !== kind) continue;
      const from = dir === "down" ? e.from : e.to;
      const to = dir === "down" ? e.to : e.from;
      if (from !== cur || to === id || out.has(to)) continue;
      if (usagesOnly ? !usageIds.has(to) : usageIds.has(to)) continue;
      out.add(to);
      if (transitive) queue.push(to);
    }
  }
  return [...out];
}

// The "show related" groups offered on an element's context menu:
// decomposition (direct composition children as usage nodes / roles),
// its type (typing edge — e.g. outputTempSensor → Thermistor),
// specializations (subtypes, all levels) and satisfy links
// (requirements it satisfies, or — on a requirement — what satisfies it).
function relatedGroups(id) {
  const satisfied = relatedIds(id, "satisfy", "down");   // requirements of a part
  const satisfiers = relatedIds(id, "satisfy", "up");    // parts of a requirement
  const satisfyLabel = satisfied.length && satisfiers.length
    ? "satisfy relations"
    : (satisfiers.length && !satisfied.length
        ? "satisfying elements" : "satisfied requirements");
  const verified = relatedIds(id, "verify", "down");
  const verifiers = relatedIds(id, "verify", "up");
  const verifyLabel = verified.length && verifiers.length
    ? "verify relations"
    : (verifiers.length && !verified.length
        ? "verifying cases" : "verified requirements");
  const hideSingleton = singletonPartUsageIds();
  const groups = [
    { label: "decomposition",
      ids: relatedIds(id, "composition", "down", {usagesOnly: true}) },
    { label: "usages", ids: model.nodes.filter(n => n.usageOwner === id)
                                       .map(n => n.id)
                                       .filter(uid => !hideSingleton.has(uid)) },
    { label: "type", ids: relatedIds(id, "typing", "down") },
    { label: "specializations",
      ids: relatedIds(id, "specialization", "up", {transitive: true}) },
    { label: satisfyLabel, ids: [...new Set([...satisfied, ...satisfiers])] },
  ];
  if (verified.length || verifiers.length)
    groups.push({
      label: verifyLabel,
      ids: [...new Set([...verified, ...verifiers])],
    });
  return groups;
}

// adds `ids` to the active View, keeping the ones already there untouched
function addToView(ids) {
  for (const nid of ids)
    if (!activeView.elements.includes(nid)) activeView.elements.push(nid);
  rebuild();
  setDirty(true);
}

// the "show related" menu entries for element `id`: one per group plus a
// combined one, each counting only what the View doesn't already show
function relatedMenuItems(id) {
  const inView = visibleIds();
  const groups = relatedGroups(id)
    .map(g => ({ ...g, missing: g.ids.filter(x => !inView.has(x)) }));
  const all = [...new Set(groups.flatMap(g => g.missing))];
  const items = groups.map(g => ({
    label: `Show ${g.label} (${g.missing.length})`,
    disabled: !g.missing.length,
    action: () => addToView(g.missing),
  }));
  items.push({
    label: `Show all related (${all.length})`,
    disabled: !all.length,
    action: () => addToView(all),
  });
  return items;
}

// future element actions (linked specification, internal diagram, ...) go here
function nodeMenuItems(id) {
  const items = [];
  if (mode === "bdd") {
    items.push({ sep: true });
    items.push(...relatedMenuItems(id));
  }
  items.push({ sep: true });
  const doc = layout.docs[id];
  if (doc)
    items.push({
      label: `Open documentation (${doc.split(/[\\/]/).pop()})`,
      action: () => {
        const url = /^https?:\/\//i.test(doc)
          ? doc
          : "/api/doc?path=" + encodeURIComponent(doc);
        window.open(url, "_blank");
      },
    });
  items.push({
    label: doc ? "Edit documentation link…" : "Add documentation link…",
    action: () => openDocDialog(id, doc),
  });
  if (mode === "bdd") {
    items.push({ sep: true });
    items.push({
      label: "Remove from view",
      action: () => {
        activeView.elements = activeView.elements.filter(x => x !== id);
        delete posMap()[id];
        rebuild();
        setDirty(true);
      },
    });
  }
  return items;
}

function edgeMenuItems(key) {
  return [{
    label: "Hide connection",
    action: () => {
      hiddenEdges.add(key);
      rebuild();
      setDirty(true);
    },
  }];
}

function backgroundMenuItems() {
  return [
    {
      label: `Unhide connections (${hiddenEdges.size})`,
      disabled: mode !== "bdd" || !hiddenEdges.size,
      action: () => {
        hiddenEdges.clear();
        rebuild();
        setDirty(true);
      },
    },
    { sep: true },
    { label: "Fit view", action: fitView },
  ];
}

svg.addEventListener("contextmenu", evt => {
  evt.preventDefault();
  if (!expertMode) return;
  const nodeEl = evt.target.closest(".node");
  if (nodeEl) {
    showMenu(evt.clientX, evt.clientY, nodeMenuItems(nodeEl.dataset.id));
    return;
  }
  const edgeEl = evt.target.closest(".edge");
  if (edgeEl) {
    showMenu(evt.clientX, evt.clientY, edgeMenuItems(edgeEl.dataset.key));
    return;
  }
  showMenu(evt.clientX, evt.clientY, backgroundMenuItems());
});

svg.addEventListener("wheel", evt => {
  evt.preventDefault();
  const k = evt.deltaY < 0 ? 1.1 : 1 / 1.1;
  zoomAtClient(evt.clientX, evt.clientY, k);
}, { passive: false });

// ---------------------------------------------------------------- persistence

async function save() {
  for (const id in nodes) posMap()[id] = { x: nodes[id].x, y: nodes[id].y };
  if (activeView) {
    activeView.hiddenEdges = [...hiddenEdges];
    activeView.view = { ...view };
    activeView.version = VIEW_VERSION;
    activeView.options = displayOpts();
  }

  layout.version = LAYOUT_VERSION;
  layout.docs = layout.docs || {};
  layout.treeOpen = treeOpen;
  layout.expertMode = expertMode;
  layout.activeView = activeViewId;
  for (const key of STALE_LAYOUT_KEYS) delete layout[key];
  delete layout.home;  // No longer used

  const requests = [
    fetch("/api/layout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(layout),
    }),
  ];
  if (activeViewId)
    requests.push(fetch(`/api/views/${activeViewId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(activeView),
    }));
  const results = await Promise.all(requests);
