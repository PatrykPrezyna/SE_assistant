<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Viewer</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none;
    font-family: "Segoe UI", system-ui, sans-serif; background: #f3f5f8;
    color: #1c1c1c; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { position: relative; z-index: 8; display: flex; flex: none;
    align-items: center; gap: 8px; min-height: 48px; padding: 8px 12px;
    background: #fff; border-bottom: 1px solid #e2e5ea; }
  header h1 { font-size: 17px; font-weight: 650; margin: 0; line-height: 1.3; }
  header button, .card, .sheet button.row { font: inherit; }
  #back { min-height: 40px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid #d5d8de; background: #fff; }
  #home, #stage { display: none; }
  body.home #home, body.view #stage { display: block; }
  #home { flex: 1; overflow: auto; padding: 16px 16px 32px; max-width: 640px;
    margin: 0 auto; width: 100%; box-sizing: border-box; }
  #home .lead { margin: 0 0 14px; color: #555; font-size: 14px; line-height: 1.45; }
  .card { display: block; width: 100%; text-align: left; margin: 0 0 12px;
    padding: 14px 16px; border-radius: 12px; border: 1px solid #e0e3e8;
    background: #fff; min-height: 48px; }
  .card strong { display: block; font-size: 16px; }
  .card span { display: block; margin-top: 4px; color: #666; font-size: 13px;
    line-height: 1.4; }
  #empty { color: #666; font-size: 15px; }
  #warn { display: none; margin: 0 0 12px; padding: 8px 10px; border-radius: 8px;
    background: #fff8e1; color: #7a5c00; font-size: 13px; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #canvas { position: absolute; inset: 0; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; background:
      linear-gradient(#e6e9ee 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #e6e9ee 1px, transparent 1px) 0 0 / 24px 24px,
      #f7f8fb; }
  svg { display: block; width: 100%; height: 100%; touch-action: none; }
  #zoombar { position: absolute; top: 12px; right: 12px; z-index: 7;
    display: none; flex-direction: column; gap: 8px; }
  body.view #zoombar { display: flex; }
  #zoombar button { width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid #d5d8de; background: #fff; font: inherit; font-size: 22px;
    line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.12); padding: 0; }
  #zoomFit { font-size: 13px; font-weight: 650; }
  .node { cursor: pointer; }
  .node rect { fill: #fff; stroke: #1a6bbf; stroke-width: 1.5; rx: 6; }
  .node.req rect { fill: #fff8e1; stroke: #a08000; }
  .node.actor rect { fill: #f3f0ff; stroke: #5b4b8a; }
  .node.usecase rect { fill: #f3fff6; stroke: #2e7d4f; }
  .node.sel rect { stroke-width: 3; }
  .node text { fill: #222; font-size: 12px; font-family: "Segoe UI", system-ui, sans-serif;
    pointer-events: none; }
  .node text.name { fill: #1c1c1c; font-size: 13px; font-weight: 600; }
  .node line.sep { stroke: #d5d8de; stroke-width: 1; }
  .node text.docicon { font-size: 11px; }
  .edge line { stroke: #555; stroke-width: 1.2; fill: none; }
  .edge.typing line { stroke-dasharray: 5 4; }
  .edge.satisfy line { stroke: #a08000; stroke-dasharray: 5 4; }
  .edge.verify line { stroke: #1a6aa8; stroke-dasharray: 5 4; }
  .edge.connector line { stroke: #2a8f4d; stroke-width: 1.4; }
  .edge.association line { stroke: #6a3fa0; }
  .edge text { fill: #444; font-size: 11px; font-family: "Segoe UI", system-ui, sans-serif; }
  #legend { position: absolute; left: 12px; bottom: 10px; z-index: 5;
    background: rgba(255,255,255,.95); border: 1px solid #ddd;
    border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #333;
    display: none; }
  #legend .lrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  #legend svg { flex: none; }
  body.sheet #legend { display: none !important; }
  #sheet { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    max-height: 50%; max-height: 50dvh; box-sizing: border-box; overflow: auto;
    touch-action: pan-y; background: #fff; border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 28px rgba(0,0,0,.16); padding: 8px 16px 24px; }
  body.sheet #sheet { display: block; }
  #sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: #ddd;
    margin: 4px auto 10px; }
  #sheet h2 { font-size: 18px; margin: 0 8px 2px 0; }
  #sheet .kind { color: #777; font-size: 12px; margin: 0 0 10px; }
  #sheet .doc { white-space: pre-wrap; font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
  #sheet .doc:empty, #sheet .doc.hidden { display: none; }
  #docLink { display: inline-block; margin: 0 0 14px; color: #1a6bbf; font-size: 15px; }
  #docLink.hidden { display: none; }
  #sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: #888; margin: 8px 0; }
  #sheet h3.hidden, #sheet ul.hidden { display: none; }
  #sheet ul { list-style: none; margin: 0 0 8px; padding: 0; }
  #sheet button.row { display: block; width: 100%; text-align: left;
    padding: 10px 12px; margin: 0 0 8px; border-radius: 10px;
    border: 1px solid #e4e6eb; background: #fafbfc; min-height: 44px; }
  #sheet button.row small { display: block; color: #555; font-size: 13px;
    white-space: pre-wrap; margin-top: 2px; }
  #closeSheet { position: absolute; top: 10px; right: 12px; border: none;
    background: none; font-size: 22px; line-height: 1; padding: 8px; color: #666; }
</style>
</head>
<body class="home">
<header>
  <button type="button" id="back" hidden>Views</button>
  <h1 id="title">Viewer</h1>
</header>
<main id="home">
  <p class="lead">Prepared views. Nothing here can be moved.</p>
  <div id="warn"></div>
  <div id="cards"></div>
  <p id="empty" hidden>No prepared views yet.</p>
</main>
<div id="stage">
  <div id="legend"></div>
  <div id="canvas"></div>
  <div id="zoombar">
    <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
    <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
    <button type="button" id="zoomFit" aria-label="Show whole diagram">Fit</button>
  </div>
</div>
<aside id="sheet" aria-live="polite">
  <div class="grab"></div>
  <button type="button" id="closeSheet" aria-label="Close">×</button>
  <h2 id="sheetName"></h2>
  <p class="kind" id="sheetKind"></p>
  <p class="doc" id="sheetDoc"></p>
  <a id="docLink" target="_blank" rel="noopener">Open documentation</a>
  <h3 id="reqHead">Requirements</h3>
  <ul id="reqList"></ul>
  <h3 id="byHead">Satisfied by</h3>
  <ul id="byList"></ul>
  <h3 id="verHead">Verified by</h3>
  <ul id="verList"></ul>
</aside>
<script id="viewer-data" type="application/json">__VIEWER_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("viewer-data").textContent);
const model = DATA.model || { nodes: [], edges: [], warnings: [] };
const views = DATA.views || [];
const docs = DATA.docs || {};
const byId = Object.fromEntries((model.nodes || []).map(n => [n.id, n]));

const NS = "http://www.w3.org/2000/svg";
const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(text, font) {
  measureCtx.font = font;
  return measureCtx.measureText(text).width;
}
function edgeKey(d) {
  return d.kind + "|" + d.from + "|" + d.to + "|" + (d.label || "");
}
function partUsagesByTypeId() {
  const map = new Map();
  for (const e of model.edges || []) {
    if (e.kind !== "typing") continue;
    const usage = byId[e.from], type = byId[e.to];
    if (!usage || usage.kind !== "part") continue;
    if (!type || type.kind !== "part def") continue;
    const list = map.get(e.to) || [];
    list.push(e.from);
    map.set(e.to, list);
  }
  return map;
}
function suppressedSingletonUsages(vis) {
  const suppressed = new Set();
  for (const [typeId, usageIds] of partUsagesByTypeId()) {
    if (usageIds.length !== 1) continue;
    const u = usageIds[0];
    if (vis.has(typeId) && vis.has(u)) suppressed.add(u);
  }
  return suppressed;
}
// Explorer display defaults (NOTATION.md): name only, attribute and parts
// compartments on, no package line, no doc body. The published page has no
// Display menu, so these are fixed.
const LINE_H = 16, PAD = 8;
const NAME_FONT = '600 13px "Segoe UI", system-ui, sans-serif';
const BODY_FONT = '12px "Segoe UI", system-ui, sans-serif';
function nodeLines(d) {
  const header = [(d.shortName ? d.shortName + " " : "") + d.name];
  const compartments = [];
  const attrs = d.attributes || [];
  if (attrs.length) compartments.push(attrs.slice());
  const parts = d.parts || [];
  if (parts.length) {
    const lines = [];
    for (const p of parts) {
      lines.push(p.text);
      for (const a of p.attrs || []) lines.push("    ." + a);
    }
    compartments.push(lines);
  }
  return { header, compartments };
}
function nodeSize(d) {
  const { header, compartments } = nodeLines(d);
  let w = 110;
  for (const text of header)
    w = Math.max(w, textWidth(text, NAME_FONT) + 2 * PAD);
  for (const comp of compartments)
    for (const text of comp)
      w = Math.max(w, textWidth(text, BODY_FONT) + 2 * PAD);
  w = Math.ceil(w);
  let y = PAD + 12 + header.length * LINE_H - 4;
  for (const comp of compartments)
    y += 6 + comp.length * LINE_H - 4;
  return { w, h: y - LINE_H + PAD + 6 };
}
function drawNode(n, selected) {
  const d = n.data;
  const { header, compartments } = nodeLines(d);
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "node"
    + (d.kind.startsWith("requirement") ? " req" : "")
    + (d.kind === "actor def" || d.kind === "actor" ? " actor" : "")
    + (d.kind === "use case def" || d.kind === "use case" ? " usecase" : "")
    + (d.id === selected ? " sel" : ""));
  g.dataset.id = d.id;
  g.setAttribute("transform", "translate(" + n.x + " " + n.y + ")");
  const rect = document.createElementNS(NS, "rect");
  rect.setAttribute("width", n.w);
  rect.setAttribute("height", n.h);
  rect.setAttribute("rx", 6);
  g.appendChild(rect);
  let y = PAD + 12;
  function addText(text, cls, centered, italic) {
    const t = document.createElementNS(NS, "text");
    if (cls) t.setAttribute("class", cls);
    if (italic) t.setAttribute("font-style", "italic");
    t.setAttribute("x", centered ? n.w / 2 : PAD);
    if (centered) t.setAttribute("text-anchor", "middle");
    t.setAttribute("y", y);
    t.textContent = text;
    g.appendChild(t);
    y += LINE_H;
  }
  for (const text of header) addText(text, "name", true, !!d.abstract);
  y -= 4;
  for (const comp of compartments) {
    const sepY = y - 12 + 4;
    const sep = document.createElementNS(NS, "line");
    sep.setAttribute("class", "sep");
    sep.setAttribute("x1", 0);
    sep.setAttribute("x2", n.w);
    sep.setAttribute("y1", sepY);
    sep.setAttribute("y2", sepY);
    g.appendChild(sep);
    y += 6;
    for (const text of comp) addText(text, "", false, false);
    y -= 4;
  }
  if (docs[d.id]) {
    const icon = document.createElementNS(NS, "text");
    icon.setAttribute("class", "docicon");
    icon.setAttribute("x", n.w - 4);
    icon.setAttribute("y", 13);
    icon.setAttribute("text-anchor", "end");
    icon.textContent = "📄";
    g.appendChild(icon);
  }
  return g;
}
function state() {
  const q = new URLSearchParams(location.search);
  return { v: q.get("v"), e: q.get("e") };
}
function go(v, e, push) {
  const q = new URLSearchParams();
  if (v) q.set("v", v);
  if (e) q.set("e", e);
  const next = location.pathname + (q.toString() ? "?" + q.toString() : "");
  const now = location.pathname + location.search;
  if (next === now) { render(); return; }
  history[push ? "pushState" : "replaceState"](null, "", next);
  render();
}
function findView(id) {
  return views.find(v => v.id === id) || null;
}
function requirementsOf(id) {
  const out = [];
  for (const e of model.edges || [])
    if ((e.kind === "satisfy" || e.kind === "verify") && e.from === id && byId[e.to] && !out.includes(e.to))
      out.push(e.to);
  return out;
}
function verifiedBy(id) {
  const out = [];
  for (const e of model.edges || [])
    if (e.kind === "verify" && e.to === id && byId[e.from] && !out.includes(e.from))
      out.push(e.from);
  return out;
}
function satisfiersOf(id) {
  const out = [];
  for (const e of model.edges || [])
    if (e.kind === "satisfy" && e.to === id && byId[e.from] && !out.includes(e.from))
      out.push(e.from);
  return out;
}
function fillLinks(listId, headId, ids, viewId) {
  const list = document.getElementById(listId);
  const head = document.getElementById(headId);
  list.textContent = "";
  head.classList.toggle("hidden", !ids.length);
  list.classList.toggle("hidden", !ids.length);
  for (const id of ids) {
    const n = byId[id];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "row";
    btn.textContent = n.name;
    if (n.doc) {
      const small = document.createElement("small");
      small.textContent = n.doc;
      btn.appendChild(small);
    }
    btn.addEventListener("click", () => go(viewId, id, true));
    list.appendChild(btn);
  }
}
function showSheet(view, id) {
  const n = byId[id];
  document.body.classList.toggle("sheet", !!n);
  if (!n) return;
  document.getElementById("sheetName").textContent = n.name;
  document.getElementById("sheetKind").textContent =
    "«" + n.kind + "»" + (n.shortName ? "  «" + n.shortName + "»" : "");
  const doc = document.getElementById("sheetDoc");
  doc.textContent = n.doc || "";
  doc.classList.toggle("hidden", !n.doc);
  const link = document.getElementById("docLink");
  const href = docs[id];
  if (href) {
    link.href = href;
    const leaf = href.split(/[\\/]/).pop();
    link.textContent = /^https?:\/\//i.test(href)
      ? "Open documentation" : "Open documentation (" + leaf + ")";
    link.classList.remove("hidden");
  } else {
    link.removeAttribute("href");
    link.classList.add("hidden");
  }
  fillLinks("reqList", "reqHead", requirementsOf(id), view.id);
  fillLinks("byList", "byHead", satisfiersOf(id), view.id);
  fillLinks("verList", "verHead", verifiedBy(id), view.id);
}
function renderHome() {
  document.body.className = "home";
  document.getElementById("back").hidden = true;
  document.getElementById("title").textContent = "Viewer";
  const legend = document.getElementById("legend");
  legend.style.display = "none";
  legend.textContent = "";
  const warn = document.getElementById("warn");
  const warnings = model.warnings || [];
  warn.style.display = warnings.length ? "block" : "none";
  warn.textContent = warnings.length
    ? "The model has " + warnings.length + " validation warning"
      + (warnings.length === 1 ? "" : "s") + "."
    : "";
  const cards = document.getElementById("cards");
  cards.textContent = "";
  document.getElementById("empty").hidden = views.length > 0;
  for (const view of views) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    const name = document.createElement("strong");
    name.textContent = view.name;
    btn.appendChild(name);
    const meta = document.createElement("span");
    const count = (view.elements || []).filter(id => byId[id]).length;
    meta.textContent = (view.description ? view.description + " — " : "")
      + count + (count === 1 ? " element" : " elements");
    btn.appendChild(meta);
    btn.addEventListener("click", () => go(view.id, null, true));
    cards.appendChild(btn);
  }
}
function place(view) {
  const vis = new Set((view.elements || []).filter(id => byId[id]));
  const suppressed = suppressedSingletonUsages(vis);
  const saved = view.nodes || {};
  const nodes = {};
  const pending = [];
  let maxY = 24;
  for (const id of vis) {
    if (suppressed.has(id)) continue;
    const size = nodeSize(byId[id]);
    const pos = saved[id];
    if (pos && typeof pos.x === "number" && typeof pos.y === "number") {
      nodes[id] = { data: byId[id], x: pos.x, y: pos.y, w: size.w, h: size.h };
      maxY = Math.max(maxY, pos.y + size.h);
    } else {
      pending.push(id);
    }
  }
  let y = pending.length && Object.keys(nodes).length ? maxY + 32 : 24;
  for (const id of pending) {
    const size = nodeSize(byId[id]);
    nodes[id] = { data: byId[id], x: 24, y, w: size.w, h: size.h };
    y += size.h + 24;
  }
  // The Explorer stores positions in a pannable world. Move the whole
  // drawing so its top-left sits on the page; relative placement stays.
  let minX = Infinity, minY = Infinity;
  for (const n of Object.values(nodes)) {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
  }
  if (Number.isFinite(minX)) {
    const dx = 24 - minX, dy = 24 - minY;
    for (const n of Object.values(nodes)) { n.x += dx; n.y += dy; }
  }
  return nodes;
}
function appendMarkers(svg) {
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    '<marker id="mTriangle" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="0" refY="7" orient="auto">' +
      '<path d="M0,0 L14,7 L0,14 Z" fill="#fff" stroke="#555" stroke-width="1.2"/></marker>' +
    '<marker id="mDiamond" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto">' +
      '<path d="M0,5 L8,0 L16,5 L8,10 Z" fill="#555"/></marker>' +
    '<marker id="mOpen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">' +
      '<path d="M0,1 L10,6 L0,11" fill="none" stroke="#555" stroke-width="1.2"/></marker>' +
    '<marker id="mOpenSat" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">' +
      '<path d="M0,1 L10,6 L0,11" fill="none" stroke="#a08000" stroke-width="1.2"/></marker>' +
    '<marker id="mBall" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5">' +
      '<circle cx="5" cy="5" r="4" fill="#2a8f4d"/></marker>';
  svg.appendChild(defs);
}
const LEGEND_ORDER = ["specialization", "composition", "typing", "satisfy", "verify", "connector", "association"];
const LEGEND_LABELS = {
  specialization: "kind of",
  composition: "composition (has part)",
  typing: "is a",
  satisfy: "satisfies requirement",
  verify: "verifies requirement",
  connector: "connector",
  association: "association (actor/subject ↔ use case)",
};
function legendRow(kind) {
  const dashed = kind === "typing" || kind === "satisfy" || kind === "verify";
  const color = kind === "satisfy" ? "#a08000"
    : kind === "verify" ? "#1a6aa8"
    : kind === "connector" ? "#2a8f4d"
    : kind === "association" ? "#6a3fa0"
    : "#555";
  let marker = "";
  if (kind === "specialization") marker = 'marker-end="url(#mTriangle)"';
  if (kind === "composition") marker = 'marker-start="url(#mDiamond)"';
  if (kind === "typing") marker = 'marker-end="url(#mOpen)"';
  if (kind === "satisfy") marker = 'marker-end="url(#mOpenSat)"';
  if (kind === "verify") marker = 'marker-end="url(#mOpen)"';
  if (kind === "connector") marker = 'marker-start="url(#mBall)" marker-end="url(#mBall)"';
  return '<div class="lrow"><svg width="66" height="14">' +
    '<line x1="2" y1="7" x2="48" y2="7" stroke="' + color + '" stroke-width="1.2" ' +
    (dashed ? 'stroke-dasharray="5 4" ' : "") + marker + "/></svg>" +
    "<span>" + LEGEND_LABELS[kind] + "</span></div>";
}
function updateLegend(shown) {
  const box = document.getElementById("legend");
  const kinds = new Set(shown.map(e => e.kind));
  const rows = LEGEND_ORDER.filter(k => kinds.has(k));
  if (!rows.length) {
    box.style.display = "none";
    box.textContent = "";
    return;
  }
  box.innerHTML = rows.map(legendRow).join("");
  box.style.display = "block";
}
function renderView(view, selected) {
  document.body.className = "view" + (selected && byId[selected] ? " sheet" : "");
  document.getElementById("back").hidden = false;
  document.getElementById("title").textContent = view.name;
  const nodes = place(view);
  const hidden = new Set(view.hiddenEdges || []);
  const shown = (model.edges || []).filter(d =>
    nodes[d.from] && nodes[d.to] && !hidden.has(edgeKey(d))
    && !(d.usageId && nodes[d.usageId])
    && !(d.fromUsage && nodes[d.fromUsage] && d.toUsage && nodes[d.toUsage]));
  let maxX = 320, maxY = 200;
  for (const n of Object.values(nodes)) {
    maxX = Math.max(maxX, n.x + n.w + 32);
    maxY = Math.max(maxY, n.y + n.h + 32);
  }
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "diagram");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  appendMarkers(svg);
  mountCamera(svg, view.id, maxX, maxY);
  const edges = document.createElementNS(NS, "g");
  const layer = document.createElementNS(NS, "g");
  svg.appendChild(edges);
  svg.appendChild(layer);
  const pairCount = {}, pairSeen = {};
  for (const d of shown) {
    const key = [d.from, d.to].sort().join("|");
    pairCount[key] = (pairCount[key] || 0) + 1;
  }
  for (const d of shown) {
    const a = nodes[d.from], b = nodes[d.to];
    const key = [d.from, d.to].sort().join("|");
    const i = (pairSeen[key] = (pairSeen[key] || 0) + 1);
    const off = pairCount[key] > 1 ? (i - 1 - (pairCount[key] - 1) / 2) * 10 : 0;
