[project]
name = "sysml-explorer"
version = "0.1.0"
description = "Interactive SysML v2 model explorer with manual element placement."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sysml-explorer = "sysml_explorer.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sysml_explorer = ["viewer.html"]
